<script>window.WH_STANDALONE=true;
/* Fill the whole screen on every phone. iPhone home-screen apps sometimes report a viewport shorter than the screen,
   which leaves a strip at the bottom. On iPhone we size the app to the physical screen instead. */
(function(){
  var d=document.documentElement;
  var iOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var standalone=(window.navigator.standalone===true)||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  var maxH=0;
  function fit(){
    var portrait=window.innerHeight>=window.innerWidth;
    var scr=portrait?Math.max(screen.height,screen.width):Math.min(screen.height,screen.width);
    var h=window.innerHeight;
    if(iOS&&standalone){ h=Math.max(h,scr); }
    if(h>maxH||!iOS) maxH=h;
    d.style.setProperty('--app-h',(iOS&&standalone?Math.max(h,maxH):h)+'px');
    d.classList.toggle('wh-ios',iOS); d.classList.toggle('wh-standalone',standalone);
    window.WH_FIT={inner:window.innerHeight,screen:scr,used:h,iOS:iOS,standalone:standalone};
  }
  fit();
  addEventListener('resize',fit); addEventListener('orientationchange',function(){ maxH=0; setTimeout(fit,250); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) setTimeout(fit,100); });
  document.addEventListener('focusout',function(){ setTimeout(fit,150); });
})();
</script>
<style>html,body{margin:0}
html.wh-standalone,html.wh-standalone body{height:var(--app-h,100%);min-height:var(--app-h,100%);overflow:hidden}
html.wh-standalone #app{position:absolute!important;top:0!important;left:0;right:0;bottom:auto!important;height:var(--app-h,100%)!important}img{max-width:100%}[hidden]{display:none!important}
html [data-a^="ai"],html .card.ai{display:none!important}</style>

<body>
<title>Work Harder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app — header band, scrolling body, mini/rest bars, bottom tab bar. Dark-first like a gym floor; light mirrors it. */
:root{
  --bg:#0E1114; --surface:#161B20; --surface2:#1E252C; --line:#29313A; --fg:#EDF1F4; --muted:#8C97A3;
  --accent:#3D8BFF; --on-accent:#FFFFFF; --gold:#F2B630; --good:#2FBF71; --good-bg:rgba(47,191,113,.13); --danger:#F0564A;
  --warm:#E9B949; --drop:#B07CFF; --fail:#F0564A;
  --fig:#C9D2DA; --fig-far:#5A6570; --equip:#3A4550; --hot:#FF5A36; --hot-soft:#B9573F;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --r:14px; --r-sm:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#E9EDF1; --line:#D6DCE2; --fg:#11161B; --muted:#5D6772;
  --accent:#1E6FE8; --gold:#B57D07; --good:#178A4C; --good-bg:rgba(23,138,76,.11); --danger:#CF3A2F;
  --warm:#B98A12; --drop:#7A4BD6; --fail:#CF3A2F; --fig:#3C4650; --fig-far:#AEB7C0; --equip:#C3CBD3; --hot:#E8431E; --hot-soft:#F2A08C; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#E9EDF1; --line:#D6DCE2; --fg:#11161B; --muted:#5D6772;
  --accent:#1E6FE8; --gold:#B57D07; --good:#178A4C; --good-bg:rgba(23,138,76,.11); --danger:#CF3A2F;
  --warm:#B98A12; --drop:#7A4BD6; --fail:#CF3A2F; --fig:#3C4650; --fig-far:#AEB7C0; --equip:#C3CBD3; --hot:#E8431E; --hot-soft:#F2A08C; color-scheme:light; }

*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative}
#hdr{flex:none;background:var(--bg);border-bottom:1px solid var(--line)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-block:14px 28px;overscroll-behavior:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.ic.dim{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .good{color:var(--good)}
.minw{min-width:0;flex:1}
.center{text-align:center}

/* header */
.hdr-in{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;min-height:54px;padding-block:6px}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:6px}
.hdr-in h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.02em;text-transform:uppercase;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-in h1.big{font-size:30px;font-weight:900;letter-spacing:.01em}
.hdr-l:empty{display:none}
.hdr-in:has(.hdr-l:empty){grid-template-columns:1fr auto}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--fg)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn.sm{width:30px;height:30px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--muted);margin-inline:6px}
.syncdot[data-state="ok"]{background:var(--good)} .syncdot[data-state="busy"]{background:var(--gold)}
.statbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:8px 12px}
.statbar label,.kv3 label,.kv2 label{display:block;font-size:12px;color:var(--muted)}
.statbar b{font-size:17px;font-variant-numeric:tabular-nums}
.statbar b[data-clock]{color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:0;background:var(--surface2);color:var(--fg);font-weight:600;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger-t{background:transparent;color:var(--danger)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.btn.strava{background:transparent;border:1.5px solid var(--line)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{height:40px}

/* type */
.sec{margin:8px 0 0;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.sub{margin:4px 0 -4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 0}
.notes{margin:0;white-space:pre-wrap}

/* cards */
.card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:16px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.feed{cursor:pointer}
.feed:hover{background:var(--surface2)}
.feed-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.feed h3{font-size:17px}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv3 b{font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.kv3.big b{font-size:20px}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gold b,.gold-t{color:var(--gold)}
.gold-t{display:flex;align-items:center;gap:6px}
.feed-ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.feed-ex li{display:flex;align-items:center;gap:10px;min-width:0}
.feed-ex li span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.routine .row2{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}

/* figure */
.thumb{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:11px;background:var(--surface2);flex:none;overflow:hidden}
.thumb.sm{width:32px;height:32px;border-radius:8px}
.thumb .fig{width:118%;height:118%}
.fig .fx-far{stroke:var(--fig-far);stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .fx-near,.fig .fx-body{stroke:var(--fig);stroke-width:7.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .fx-body{stroke-width:10}
.fig .fx-head{fill:var(--fig)}
.fig .fx-ground{stroke:var(--line);stroke-width:2}
.fig .fx-equip{fill:var(--equip)} .fig .fx-box{fill:var(--equip)}
.fig .fx-frame{stroke:var(--equip);stroke-width:4;fill:none;stroke-linecap:round}
.fig .fx-pad{stroke:var(--equip);stroke-width:8;fill:none;stroke-linecap:round}
.fig .fx-bar{stroke:var(--muted);stroke-width:4;fill:none;stroke-linecap:round}
.fig .fx-plate{fill:var(--accent);stroke:var(--bg);stroke-width:1.5}
.fig .fx-hub{fill:var(--bg)}
.fig .fx-db{fill:var(--accent)}
.fig .fx-pad2{fill:var(--equip);stroke:var(--fig-far);stroke-width:1}
.fig .fx-rail{stroke:var(--fig-far);stroke-width:3;fill:none;stroke-linecap:round}
.fig .fx-band{stroke:#2FBF71;stroke-width:3;fill:none;stroke-linecap:round}
.fig .fx-band-h{fill:#2FBF71}
.fig .fx-cable{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:3 3;fill:none}
.fig .fx-pulley{fill:var(--surface2);stroke:var(--muted);stroke-width:1.5}
.fig .fx-water{stroke:var(--accent);stroke-width:2;fill:none;opacity:.6}
.stage{background:radial-gradient(120% 90% at 50% 100%,var(--surface2),var(--surface));border-radius:var(--r);display:grid;place-items:center;padding:6px;cursor:default}
.stage .fig{width:100%;max-width:360px;height:auto;aspect-ratio:240/210}

/* home */
.weekcard{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.wk-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.wk-count{display:flex;align-items:baseline;gap:6px}
.wk-count .num{font-family:var(--f-display);font-weight:900;font-size:46px;line-height:.9}
.wk-count .of{color:var(--muted);font-weight:600}
.streak{display:flex;align-items:center;gap:6px;color:var(--muted)}
.streak b{display:block;font-family:var(--f-display);font-size:26px;line-height:.9;color:var(--fg)}
.streak span{font-size:12px}
.streak.hot .ic{color:var(--gold)}
.wkbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.wkbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.wkdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wkday{display:grid;place-items:center;height:30px;border-radius:8px;background:var(--surface2);font-size:12px;color:var(--muted)}
.wkday.on{background:var(--accent);color:var(--on-accent)}
.wkday.today{box-shadow:inset 0 0 0 1.5px var(--fg)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:10px 4px 6px}
.empty h2{margin:0;font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.empty p{margin:0 0 6px;color:var(--muted);max-width:42ch}
.empty .row2{width:100%}
.empty-fig{width:180px;max-width:60%}
.empty-fig .fig{width:100%;height:auto}

/* exercise list */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-sm);padding:0 12px;min-height:46px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;outline:0;min-width:0;color:var(--fg);font-size:16px}
select,input:not([type]),input[type="text"],input[type="search"],input[type="email"],input[type="password"],textarea,.title-in{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);min-height:44px;padding:8px 12px;width:100%;color:var(--fg);font-size:16px}
textarea{resize:vertical;line-height:1.4}
.title-in{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.01em;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding-inline:0}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:8px 2px;border-bottom:1px solid var(--line)}
.exrow:hover{background:var(--surface)}
.exrow-t{display:flex;flex-direction:column;flex:1;min-width:0}
.exrow-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exrow .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.exrow.sel .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.exrow.sel{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pad{padding:16px 0}
.floatbar{position:sticky;bottom:0;padding-block:10px;background:linear-gradient(transparent,var(--bg) 30%)}

/* logger */
.exc{gap:8px}
.exc-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.exhead{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;text-align:left;min-width:0;flex:1;flex-wrap:wrap}
.exhead b{font-size:16px}
.exhead b.acc{color:var(--accent)}
.note-in{border:0!important;background:transparent!important;padding:2px 0!important;min-height:30px!important;font-size:16px!important}
.restchip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:2px 0}
.sets{display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.srow{display:grid;align-items:center;gap:6px;padding:3px 4px;border-radius:8px;min-width:0}
.srow.g1{grid-template-columns:34px minmax(0,1.3fr) minmax(0,1fr) 40px}
.srow.g2{grid-template-columns:34px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 40px}
.srow.g1.nocheck{grid-template-columns:34px minmax(0,1fr) 34px}
.srow.g2.nocheck{grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 34px}
.srow.head{font-size:11px;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:center}
.srow.head span:nth-child(2){text-align:left}
.srow.nocheck.head span:nth-child(2){text-align:center}
.srow.done{background:var(--good-bg)}
.slab{width:30px;height:30px;border-radius:8px;border:0;background:var(--surface2);font-weight:700;font-size:14px;display:grid;place-items:center;font-variant-numeric:tabular-nums;justify-self:center}
.srow.done .slab{background:transparent}
.slab.t-w{color:var(--warm)} .slab.t-d{color:var(--drop)} .slab.t-f{color:var(--fail)}
.prev{border:0;background:transparent;color:var(--muted);font-size:13px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0;min-width:0}
.cell{text-align:center;min-height:36px!important;padding:4px 2px!important;border-radius:8px!important;background:var(--surface2)!important;border:0!important;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.cell::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.srow.done .cell{background:transparent!important}
.chk{width:36px;height:34px;border-radius:9px;border:0;background:var(--surface2);display:grid;place-items:center;color:var(--muted);justify-self:center}
.chk.on{background:var(--good);color:#fff}
.chk .ic{width:20px;height:20px}
.chk.on .prflag{color:#fff}
.prflag{display:grid;place-items:center}
.rm{width:30px;height:30px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;justify-self:center}

/* mannequin + muscle map */
.fig .mq{fill:var(--fig);stroke:var(--fig);stroke-width:.6;stroke-linejoin:round}
.fig .mq.far{fill:var(--fig-far);stroke:var(--fig-far)}
.fig .mq.mp,.fig .mo.mp{fill:var(--hot);stroke:var(--hot)}
.fig .mq.ms,.fig .mo.ms{fill:var(--hot-soft);stroke:var(--hot-soft)}
.fig .mq.far.mp{fill:color-mix(in srgb,var(--hot) 60%,var(--fig-far));stroke:none}
.fig .mq.far.ms{fill:color-mix(in srgb,var(--hot-soft) 55%,var(--fig-far));stroke:none}
.fig .mo{stroke-width:.5;stroke-linejoin:round}
.fig .mq.msh,.fig .mq.msh.mp,.fig .mq.msh.ms{stroke:color-mix(in srgb,var(--bg) 50%,var(--fig));stroke-width:.7}
.fig .mq.msh.far{stroke:color-mix(in srgb,var(--bg) 40%,var(--fig-far))}
.fig .mdef{stroke:color-mix(in srgb,var(--bg) 55%,transparent);stroke-width:.8;fill:none;stroke-linecap:round}
.fig .fx-view{fill:var(--muted);font:700 8px var(--f-body);letter-spacing:.08em}
.thumb .fig .fx-view{display:none}

.thumb .fig .mq{stroke-width:1.2}
.musc-in{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:center}
.bodymap{width:100%;height:auto;display:block}
.bm-sil{fill:var(--surface2)}
.bm{fill:color-mix(in srgb,var(--fg) 12%,var(--surface2))}
.bm.p{fill:var(--hot)} .bm.s{fill:var(--hot-soft)}
.bm-lbl{fill:var(--muted);font-size:10px;font-family:var(--f-body);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.musc-k{display:flex;flex-direction:column;gap:12px}
.musc-k b{font-size:13px}
.musc-k p{margin:2px 0 0;font-size:14px}
.key{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.key.p{background:var(--hot)} .key.s{background:var(--hot-soft)}
@media (max-width:380px){.musc-in{grid-template-columns:1fr}}
/* routine page */
.linkhead{border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.sec-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.acc-t{color:var(--accent);font-weight:600}
.rex{gap:8px}
.rline{display:flex;align-items:center;gap:6px}
.rtable{display:flex;flex-direction:column;border:0;background:transparent;padding:0;width:100%;text-align:center;border-radius:8px}
.rtable:hover{background:var(--surface2)}
.rrow{display:grid;align-items:center;gap:6px;padding:6px 0;font-weight:600}
.rrow:nth-child(odd):not(.head){background:color-mix(in srgb,var(--surface2) 55%,transparent);border-radius:6px}
.rrow.g1{grid-template-columns:40px 1fr} .rrow.g2{grid-template-columns:40px 1fr 1fr}
.rrow.head{font-size:11px;letter-spacing:.07em;color:var(--muted);font-weight:700}
.rrow .slab{width:26px;height:26px;font-size:13px}
.card-h select{width:auto;min-height:34px;padding:4px 8px;font-size:14px}
.effhint{display:flex;gap:6px;align-items:flex-start;margin:2px 4px 6px;color:var(--muted);font-size:12.5px;line-height:1.3}
.effhint svg{flex:none;margin-top:1px;color:var(--warm)}
.seff{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:3px 4px 8px 42px}

.tcell{position:relative;display:block;min-width:0}

.tgo{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;padding:0}

.st-in{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}

.st-bg{fill:none;stroke:var(--surface2);stroke-width:12}
.st-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .12s linear}

.st-btns{display:flex;gap:10px;width:100%}
.st-btns .btn{flex:1;min-height:52px;font-size:16px}

/* ---- Full-screen phone layout: the app is pinned to every edge, safe areas padded inside ---- */
#app{position:fixed;top:0;bottom:0;left:0;right:0;height:auto;margin:0 auto;width:100%}
#hdr{padding-top:env(safe-area-inset-top,0px)}
#nav{padding-bottom:env(safe-area-inset-bottom,0px)}
#app:has(#nav[hidden]) #restbar:not([hidden]){padding-bottom:env(safe-area-inset-bottom,0px)}
/* ---- Organized, icon-led UI ---- */

    out[id] = {id,name,pattern,equipment,type,primary,secondary,steps,tips:tips||[],builtin:true,...(extra||{})};
  }
  return out;
}

const TIER_ORDER={S:0,A:1,B:2,C:3,D:4,F:5};
function parseNip(s){
  if(!s) return null;
  const o={ranks:[],top:/\*top/.test(s),gem:/\*gem/.test(s)};
  for(const part of s.replace(/\*top|\*gem/g,'').split(',')){ const [m,t]=part.split(':'); if(m&&t&&TIER_ORDER[t.trim()]!=null) o.ranks.push([m.trim(),t.trim()]); }
  o.best = o.ranks.length? o.ranks.map(r=>r[1]).sort((a,b)=>TIER_ORDER[a]-TIER_ORDER[b])[0] : null;
  return o;
}
(function mergeMore(){
  for(const line of EX_MORE.split('\n')){
    if(!line.trim()) continue;
    const f=line.split('|');
    let load=null; for(let i=8;i<f.length;i++){ if(f[i]&&f[i].startsWith('load=')){ load=f[i].slice(5); f[i]=''; } }
    const [id,name,pattern,equipment,type,prim,sec,steps,tips,nip]=f;
    const ex={id,name,pattern,equipment,type,primary:prim?prim.split(','):[],secondary:sec?sec.split(','):[],steps:steps?steps.split('~'):[],tips:tips?tips.split('~'):[],builtin:true};
    if(nip) ex.nip=parseNip(nip);
    if(load) ex.load=load;
    BUILTIN[id]=ex;
  }
  for(const [id,s] of Object.entries(NIP_TAGS)) if(BUILTIN[id]) BUILTIN[id].nip=parseNip(s);
})();

function legIK(hip,T){
  const L1=SEG.th, L2=SEG.sh; let dx=T[0]-hip[0], dy=T[1]-hip[1]; let d=Math.hypot(dx,dy);
  const mx=L1+L2-0.5; if(d>mx){ dx*=mx/d; dy*=mx/d; d=mx; }
  const base=Math.atan2(dx,dy)*180/Math.PI;
  const a=Math.acos(Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d))))*180/Math.PI;
  const th=base+a; const kn=[hip[0]+Math.sin(rad(th))*L1, hip[1]+Math.cos(rad(th))*L1];
  const sh=Math.atan2(T[0]-hip[0]-(kn[0]-hip[0]),T[1]-kn[1])*180/Math.PI;
  return {th,sh};
}

  if(prep.ik){ const r=legIK(pp.hip,[prep.ik.x,prep.ik.y]); p.th=r.th; p.sh=r.sh; }
  return {p,hip:pp.hip};
}

function e1rmSession(e,unit,start){ const X=getEx(e.exId); const bw=X.type==='wreps'?bodyweightAt(start||Date.now()):0; let b=0; for(const s of workingSets(e)){ const v=e1rm(toLb(num(s.w)||0,unit)+bw,num(s.r)||0); if(v>b) b=v; } return b; }
function coachInsights(){
  const ws=workoutsSorted(); const out=[]; if(ws.length<2) return out;
  const u=st.settings.unit; const now=Date.now();
  // 1) Progress made
  const gains=[];
  for(const [id,arr] of Object.entries(stats().byEx)){
    const ex=getEx(id); if(!['wr','wreps'].includes(ex.type)||arr.length<3) continue;
    const recent=arr.filter(x=>x.w.start>now-28*DAY); const older=arr.filter(x=>x.w.start<=now-28*DAY&&x.w.start>now-84*DAY);
    if(!recent.length||!older.length) continue;
    const a=Math.max(...recent.map(x=>e1rmSession(x.e,x.w.unit,x.w.start))), b=Math.max(...older.map(x=>e1rmSession(x.e,x.w.unit,x.w.start)));
    if(b>0&&a>b*1.03) gains.push({ex,pct:(a/b-1)*100});
  }
  gains.sort((a,b)=>b.pct-a.pct);
  if(gains.length) out.push({kind:'good',title:'Getting stronger',text:gains.slice(0,3).map(g=>`${g.ex.name} +${fmtN(g.pct)}%`).join(' · ')+' (est. 1-rep max, last 4 weeks vs before)'});
  // 2) Stalls
  for(const [id,arr] of Object.entries(stats().byEx)){
    const ex=getEx(id); if(!['wr','wreps'].includes(ex.type)||arr.length<4||arr[0].w.start<now-21*DAY) continue;
    if(stallInfo(id)) out.push({kind:'warn',title:`Stalled: ${ex.name}`,text:'No progress in 3 sessions. The coach will offer an S-tier swap next time it comes up in a workout.',id});
  }
  // 3) Skipped exercises in routines
  for(const r of routinesSorted()){
    const runs=ws.filter(w=>w.routineId===r.id).slice(0,3); if(runs.length<3) continue;
    for(const e of r.exercises){ if(runs.every(w=>!(w.exercises||[]).some(x=>x.exId===e.exId))) out.push({kind:'warn',title:`Skipping ${getEx(e.exId).name}`,text:`Left out of ${r.name} the last 3 times. Swap it for something you'll do, or remove it.`,id:e.exId}); }
  }
  // 4) Session length
  const recent=ws.slice(0,6).filter(w=>w.end); if(recent.length>=4){
    const avg=recent.reduce((a,w)=>a+(w.end-w.start),0)/recent.length/60000;
    if(avg>80) out.push({kind:'info',title:`Workouts average ${fmtN(avg)} min`,text:'If that is more time than you have, drop one accessory per day before shortening rest on the big lifts.'});
  }
  // 5) Weekly sets per muscle (last 14 days)
  const sets={}; for(const w of ws.filter(w=>w.start>now-14*DAY)) for(const e of w.exercises||[]){ const X=getEx(e.exId); const n=workingSets(e).length; for(const m of X.primary||[]) sets[m]=(sets[m]||0)+n/2; }
  const pull=(sets['Lats']||0)+(sets['Upper Back']||0)+(sets['Shoulders']||0)*0.3, push=(sets['Chest']||0)+(sets['Triceps']||0)*0.3;
  if(push>0){ const ratio=pull/push; out.push({kind:ratio>=1.5?'good':'warn',title:`Back-to-chest ratio ${fmtN(ratio,1)} : 1`,text:ratio>=1.5?'Good for pulling rounded shoulders back. Keep it up.':'Below the 2:1 target for posture. Add rows or rear-delt work.'}); }
  const low=['Chest','Lats','Upper Back','Shoulders','Quads','Hamstrings','Glutes'].filter(m=>(sets[m]||0)>0&&(sets[m]||0)<6);
  if(low.length) out.push({kind:'info',title:'Low weekly volume',text:`${low.join(', ')} got under 6 hard sets a week lately. 10+ is the usual target for growth.`});
  // 6) Knees
  const checks=ws.slice(0,6).filter(w=>w.knees); const achy=checks.filter(w=>w.knees==='achy').length;
  if(achy>=2) out.push({kind:'warn',title:`Knees achy in ${achy} of your last ${checks.length} check-ins`,text:'The coach is already lightening knee-heavy lifts on those days. If it keeps happening, swap squats for leg press and get your knees looked at by a physical therapist.'});
  const posts=ws.slice(0,6).map(w=>w.post).filter(Boolean);
  if(posts.length>=3){ const d=posts.filter(p=>p==='drained').length, m=posts.filter(p=>p==='more').length;
    if(d>=3) out.push({kind:'warn',title:`Drained after ${d} of your last ${posts.length} workouts`,text:'The coach is trimming accessory sets. Check sleep and food; an easy week may help.'});
    else if(m>=3) out.push({kind:'good',title:`Felt like you had more ${m} of the last ${posts.length} times`,text:'The coach is adding a set to your main lifts. Keep rating honestly.'}); }
  const cbs=comebackState(); if(cbs&&cbs.light) out.unshift({kind:'info',title:`Comeback mode: session ${cbs.stage+1} of ${CB_SESSIONS}`,text:cbs.stage===0?`${cbs.gapDays} days off. Your next workouts start lighter and climb based on how each lift feels.`:'Weights are climbing back based on your effort ratings. Keep rating every set.'});
  // 7) Consistency
  const last4=ws.filter(w=>w.start>now-28*DAY).length, goal=(st.settings.goal||4)*4;
  out.push({kind:last4>=goal*0.8?'good':'info',title:`${last4} workouts in the last 4 weeks`,text:last4>=goal*0.8?'Right on your goal. Consistency is what makes the rest work.':`Goal is about ${goal}. The plan works best when the weeks are full.`});
  return out;
}

function trophyPoints(until){

      else if(acct==='max'){ if(n<goal){ const p=2*(goal-n); pen+=p; penItems.push([`Missed ${goal-n} workout${goal-n>1?'s':''} in a week`,p]); } }

function badgeCtx(until){
  const ws=workoutsSorted().filter(w=>(until==null||w.start<=until)&&(st.settings.badgeImports||!w.imported)).slice().reverse(); // oldest first; imported history doesn't earn badges
  const c={n:ws.length,vol:0,maxVol:0,prs:0,dawn:0,night:0,knee:0,pack:0,hours:0,goalWeeks:0,maxStreak:0,ratio:0,stage:0};
  const byWk={};

    const h=new Date(w.start).getHours(); if(h<6) c.dawn++; if(h>=20) c.night++;
    const pats=(w.exercises||[]).map(e=>getEx(e.exId).pattern||''); const ids=(w.exercises||[]).map(e=>e.exId);
    if(pats.some(p=>KNEE_PATTERNS.has(p))||ids.some(i=>['spanish_squat','tib_raise','sled_drag','copenhagen','stepup','bss'].includes(i))) c.knee++;
    if(pats.some(p=>['carry','sled','walk'].includes(p))||ids.some(i=>/carry|ruck|sled|farmers|yoke|incline_walk/.test(i))) c.pack++;
    const k=weekStart(w.start); byWk[k]=(byWk[k]||0)+1; }
  const goal=st.settings.goal||4; for(const k in byWk) if(byWk[k]>=goal) c.goalWeeks++;

}

function taper3(P0,P1,P2,w0,w1,n=14){ // filled tapered quadratic stroke

}

    <div class="kv3"><div><label>Duration</label><b>${fmtDur(dur)}</b></div><div><label>Sets</label><b>${workoutSets(w)}</b></div><div><label>Streak</label><b>${streak} wk</b></div></div>
    ${prs.length?`<div class="card"><h3 class="gold-t">${ic('trophy','sm')} ${prs.length} new personal record${prs.length>1?'s':''}</h3><ul class="prlist">${prs.map(p=>`<li><span>${esc(getEx(p.exId).name)}</span><span class="muted small">${PR_LABEL[p.kind]}</span><b>${prValue(p)}</b></li>`).join('')}</ul></div>`:''}
    ${w.routineUpdated?`<p class="muted small center">${ic('spark','sm')} The coach saved today's weights into <b>${esc((st.routines[w.routineId]||{}).name||'your routine')}</b> and will set next session's targets from them.</p>`:''}

rview(p){
  const tpl=!!p.tpl; const r= tpl? TEMPLATES.find(t=>t.id===p.id) : st.routines[p.id]; if(!r) return PAGES.missing();
  const u=st.settings.unit; const m=p.metric||'volume';
  const done=workoutsSorted().filter(w=>w.routineId===r.id||norm(w.name)===norm(r.name));
  const since=Date.now()-(p.range||90)*DAY; const pts=done.filter(w=>w.start>=since).slice().reverse().map(w=>({t:w.start,v: m==='volume'? convW(workoutVolumeLb(w),'lb',u) : m==='reps'? (w.exercises||[]).reduce((a,e)=>a+(e.sets||[]).reduce((b,s)=>b+(num(s.r)||0),0),0) : ((w.end||w.start)-w.start)/60000}));
  const fmt=v=> m==='duration'? fmtN(v)+' min' : v>=10000? fmtN(v/1000,0)+'k' : fmtN(v);
  const last=pts[pts.length-1];
  const head = last? `<div class="card-h"><h3>${fmt(last.v)}${m==='volume'?' '+u:m==='reps'?' reps':''} <span class="acc-t">${new Date(last.t).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></h3><select data-f="rrange" aria-label="Range">${[[30,'Last 30 days'],[90,'Last 3 months'],[365,'Last year'],[3650,'All time']].map(([d,l])=>`<option value="${d}" ${(p.range||90)==d?'selected':''}>${l}</option>`).join('')}</select></div>` : `<div class="card-h"><h3>No history yet</h3></div><p class="muted small">Your progress on this routine shows here after you finish it.</p>`;
  const sets=(r.exercises||[]).reduce((a,e)=>a+e.sets.length,0);
  return {hdr:hdr('Routine',{left:backBtn,right:`<button class="iconbtn" data-a="routineMenu" data-id="${esc(r.id)}" data-tpl="${tpl?1:''}" aria-label="Routine options">${ic('more')}</button>`}),
  body:`<section class="gut stack">
    <div><h2 class="h2">${esc(r.name)}</h2><div class="muted small">${tpl?'Starter routine':'Your routine'} · ${(r.exercises||[]).length} exercises · ${sets} sets${done.length?` · done ${done.length}×, last ${esc(fmtDate(done[0].start))}`:''}</div></div>
    <button class="btn primary wide" data-a="startRoutine" data-id="${esc(r.id)}" data-tpl="${tpl?1:''}">${ic('play')} Start routine</button>
    <div class="card">${head}${pts.length?lineChart(pts,fmt):''}
      <div class="seg sm">${[['volume','Volume'],['reps','Reps'],['duration','Duration']].map(([k,l])=>`<button data-a="rMetric" data-v="${k}" aria-selected="${m===k}">${l}</button>`).join('')}</div></div>
    ${r.notes?`<details class="plan card"><summary><b>Game plan</b></summary><p>${esc(r.notes)}</p></details>`:''}
    <div class="sec-row"><h2 class="sec">Exercises</h2>${tpl?`<button class="btn ghost sm" data-a="saveTpl" data-id="${esc(r.id)}">Save to my routines</button>`:`<button class="btn ghost sm" data-a="editRoutine" data-id="${esc(r.id)}">${ic('edit','sm')} Edit routine</button>`}</div>
    ${(r.exercises||[]).map((e,i)=>{ const X=getEx(e.exId); const cols=colsFor(X); const rest=e.rest==null?st.settings.rest:e.rest;
      return `<div class="card rex ${e.ss?'ss':''}">
        <div class="exc-h"><button class="exhead" data-a="howTo" data-id="${esc(X.id)}" data-cue="${esc(e.note||'')}">${thumb(X)}<b class="acc">${esc(X.name)}</b>${nipBadge(X)}</button>${howBtn(X.id,e.note||'')}</div>
        ${e.ss?`<span class="ssbadge">Superset ${esc(e.ss)}</span>`:''}
        <div class="muted small rline">${ic('clock','sm')} Rest timer: ${fmtRest(rest)}</div>
        ${e.note?`<p class="cue">${ic('list','sm')}<span>${esc(e.note)}</span></p>`:''}
        <button class="rtable" data-a="${tpl?'saveTpl':'editRoutine'}" data-id="${esc(r.id)}" aria-label="Edit sets">
          <span class="rrow head g${cols.length}"><span>SET</span>${cols.map(c=>`<span>${colLabel(c,X)}</span>`).join('')}</span>
          ${e.sets.map((s,si)=>`<span class="rrow g${cols.length}"><span class="slab t-${s.type||'n'}">${setLabel(e.sets,si)}</span>${cols.map(c=>`<span class="num">${c==='t'?(s.t?fmtTime(s.t):'–'):c==='w'?(s.w!==''&&s.w!=null?wDisp(s.w,r.unit):'–'):(s[c]!==''&&s[c]!=null?esc(s[c]):'–')}</span>`).join('')}</span>`).join('')}
        </button></div>`; }).join('')}
    ${done.length?`<h2 class="sec">History</h2>${done.slice(0,5).map(feedCard).join('')}`:''}
  </section>`};
},

wview(p){

   <div><h2 class="h2">${esc(w.name)}</h2><div class="muted small">${esc(fmtWhen(w.start))}</div></div>
   <div class="kv3"><div><label>Time</label><b>${fmtDur(dur)}</b></div><div><label>Volume</label><b>${fmtN(convW(vol,'lb',u))} ${u}</b></div><div class="${prs.length?'gold':''}"><label>Records</label><b>${prs.length?ic('trophy','sm')+' ':''}${prs.length}</b></div></div>

exd(p){
  const ex=getEx(p.id); const tab=p.tab||'how';
  const h=(stats().byEx[ex.id]||[]);
  let inner='';
  if(tab==='how'){
    inner=`<div class="card"><h3>Key positions</h3>${keyFrames(ex)}</div>${ex.steps&&ex.steps.length?`<ol class="steps">${ex.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:`<p class="muted">No steps yet. Tap Edit to add them, or have Claude write them.</p>`}
     ${ex.tips&&ex.tips.length?`<div class="card tips"><h3>Tips</h3><ul>${ex.tips.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}`;
  } else if(tab==='hist'){
    inner = h.length? h.map(({w,e})=>`<div class="card"><button class="exhead" data-a="openW" data-id="${esc(w.id)}"><b>${esc(w.name)}</b><span class="muted small">${esc(fmtDate(w.start))}</span></button>
      <div class="setlist">${(e.sets||[]).map((s,i)=>`<div class="sl"><span class="slab t-${s.type||'n'}">${setLabel(e.sets,i)}</span><span>${esc(setText(s,ex,w.unit,w.dunit))}</span></div>`).join('')}</div></div>`).join('') : `<p class="muted">You haven't logged this one yet.</p>`;
  } else {
    inner = recordsFor(ex,p);
  }
  const chips=[ex.equipment,...(ex.primary||[])].filter(Boolean).map(c=>`<span class="chip">${esc(c)}</span>`).join('')+(ex.secondary||[]).map(c=>`<span class="chip soft">${esc(c)}</span>`).join('');
  return {hdr:hdr('',{left:backBtn,right:`<button class="btn sm" data-a="editEx" data-id="${esc(ex.id)}">${ic('edit','sm')} Edit</button>`}),
  body:`<section class="gut stack">
    <div class="stage">${figSVG(ex,{anim:ex.id,cls:'big'})}</div>

/* ---------- Logger (live / edit / routine) ---------- */
function loggerPage(obj,mode){
  if(!obj) return PAGES.missing();
  const u=st.settings.unit;
  let head;
  if(mode==='active'){
    const done=obj.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
    const vol=workoutVolumeLb({...obj,saved:false});
    head=hdr('Log workout',{left:`<button class="iconbtn" data-a="minimize" aria-label="Minimize">${ic('down')}</button>`,right:`<button class="btn primary sm" data-a="finish">${ic('check','sm')} Finish</button>`})
      +`<div class="statbar gut"><div><label>Duration</label><b data-clock="${obj.start}">${fmtTime((Date.now()-obj.start)/1000)}</b></div><div><label>Volume</label><b id="livevol">${fmtN(convW(vol,'lb',u))} ${u}</b></div><div><label>Sets</label><b id="livesets">${done}</b></div></div>`;
  } else if(mode==='edit'){

    chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${m} over time">${[0,0.5,1].map(f=>`<line class="grid" x1="${pl}" x2="${W-4}" y1="${Y(mx*f)}" y2="${Y(mx*f)}"/><text class="axis" x="${pl-6}" y="${Y(mx*f)+3}" text-anchor="end">${fmt(mx*f)}</text>`).join('')}

  }

  if(weighted){ rec.push(['Heaviest weight',`${fmtN(convW(b.heavy,'lb',u),1)} ${u}`],['Best est. 1RM',`${fmtN(convW(b.e1rm,'lb',u))} ${u}`],['Best set volume',`${fmtN(convW(b.setvol,'lb',u))} ${u}`]); }

function defaultName(){ const h=new Date().getHours(); return h<5?'Night Workout':h<12?'Morning Workout':h<17?'Afternoon Workout':h<21?'Evening Workout':'Night Workout'; }

  if(v) v.textContent=`${fmtN(convW(workoutVolumeLb({...a,saved:false}),'lb',u))} ${u}`;

function normalizeSets(obj,dropUndone){
  obj.exercises=(obj.exercises||[]).map(e=>{
    let sets=e.sets.map(s=>({type:s.type||'n',w:num(s.w),r:num(s.r),t:parseTime(s.t),d:num(s.d),...(s.amrap?{amrap:true}:{}),...(s.eff?{eff:s.eff}:{}),...(dropUndone?{}:{done:!!s.done})}));
    if(dropUndone) sets=sets.filter((s,i)=>e.sets[i].done);
    for(const s of sets) for(const k of ['w','r','t','d']) if(s[k]==null) delete s[k];
    return {exId:e.exId,note:e.note||'',cue:e.cue||undefined,rest:e.rest,ss:e.ss||undefined,effort:effFromSets(e)||undefined,sets};
  }).filter(e=>e.sets.length||!dropUndone);
  for(const e of obj.exercises){ if(e.rest==null) delete e.rest; if(!e.ss) delete e.ss; if(!e.cue) delete e.cue; if(!e.effort) delete e.effort; }
  return obj;
}
function convertObjUnit(obj,to){

  for(const e of obj.exercises||[]) for(const s of e.sets||[]){ if(num(s.w)!=null) s.w=round1(convW(num(s.w),from,to)); if(num(s.pw)!=null) s.pw=round1(convW(num(s.pw),from,to)); }

}

/* ---------- Set timer for timed exercises (planks, hangs, holds, carries) ---------- */
function setTimerTarget(e,s,si){
  const t=num(s.t); if(t) return t;
  const pt=num(s.pt); if(pt) return pt;
  const prev=prevSetsFor(e.exId); const ps=prev&&prev.sets[si]; if(ps&&num(ps.t)) return num(ps.t);
  const lastDone=[...e.sets].reverse().find(x=>x.done&&num(x.t)); if(lastDone) return num(lastDone.t);
  return 0; // stopwatch
}
function stNow(){ const T=ui.stimer; if(!T) return 0; const now=T.pausedAt||Date.now(); return Math.max(0,(now-T.start-T.pauseAcc)/1000); }
function renderSetTimer(){

  const e=st.active&&st.active.exercises[T.e]; if(!e){ ui.stimer=null; el.remove(); return; }
  const ex=getEx(e.exId);
  const el_=stNow(); const prep=T.phase==='prep'; const left=T.target? Math.max(0,T.target-el_) : 0;
  const big = prep? Math.max(1,Math.ceil((T.prepEnd-Date.now())/1000)) : T.target? fmtTime(Math.ceil(left)) : fmtTime(Math.floor(el_));
  const frac = prep? 0 : T.target? Math.min(1,el_/T.target) : (el_%60)/60;
  const R=92, C=2*Math.PI*R;
  el.innerHTML=`<div class="st-in">
    <div class="st-top"><b>${esc(ex.name)}</b><span class="muted">Set ${T.si+1}${T.target?` · ${fmtTime(T.target)}`:' · stopwatch'}</span></div>

      <div class="st-num"><span id="stnum">${big}</span><small>${prep?'Get ready':T.phase==='done'?'Done!':T.pausedAt?'Paused':T.target?'Hold':'Time'}</small></div></div>
    <div class="st-btns">
      ${T.phase==='done'?'':`<button class="btn" data-a="stPause">${T.pausedAt?'Resume':'Pause'}</button>`}
      ${T.target&&T.phase!=='done'?`<button class="btn" data-a="stAdd">+15 s</button>`:''}
      ${T.phase==='done'?'':`<button class="btn primary" data-a="stDone">${T.target?'Done early':'Stop & save'}</button>`}

function stTick(){
  const T=ui.stimer; if(!T) return;
  if(T.phase==='prep'){
    const n=Math.ceil((T.prepEnd-Date.now())/1000);
    if(n!==T.lastN){ T.lastN=n; if(n>0) tick1(); }
    if(Date.now()>=T.prepEnd){ T.phase='run'; T.start=Date.now(); T.pauseAcc=0; goBeep(); renderSetTimer(); }
    else { const x=$('#stnum'); if(x) x.textContent=n; }
    return;
  }
  if(T.phase!=='run' || T.pausedAt) return;
  const el_=stNow();
  if(T.target){
    const left=Math.ceil(T.target-el_);
    if(left<=3 && left>0 && left!==T.lastN){ T.lastN=left; tick1(); }
    if(el_>=T.target){ finishSetTimer(T.target); return; }
  }
  const x=$('#stnum'); if(x) x.textContent= T.target? fmtTime(Math.ceil(T.target-el_)) : fmtTime(Math.floor(el_));
  const fg=document.querySelector('#settimer .st-fg'); if(fg){ const C=2*Math.PI*92; const frac=T.target? Math.min(1,el_/T.target) : (el_%60)/60; fg.setAttribute('stroke-dashoffset',f1(C*(1-frac))); }

function cleanAnim(a){

    if(!f||typeof f!=='object') return null; const o={};
    for(const k of POSE_KEYS){ const v=Number(f[k]); if(f[k]!=null&&isFinite(v)) o[k]=Math.max(-360,Math.min(360,v)); }

function exportCSV(){
  const head=['title','start_time','end_time','description','exercise_title','superset_id','exercise_notes','set_index','set_type','weight_lbs','reps','distance_miles','duration_seconds','rpe'];
  const out=[head.join(',')]; const tn={n:'normal',w:'warmup',d:'dropset',f:'failure'};
  const fmtD=t=>{const d=new Date(t);return `${d.getDate()} ${d.toLocaleString('en-US',{month:'short'})} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
  for(const w of workoutsSorted().reverse()) for(const e of w.exercises||[]) (e.sets||[]).forEach((s,i)=>{
    out.push([w.name,fmtD(w.start),fmtD(w.end||w.start),w.notes||'',getEx(e.exId).name,'',e.note||'',i,tn[s.type||'n'],s.w!=null?round1(convW(s.w,w.unit||'lb','lb')):'',s.r??'',s.d!=null?(getEx(e.exId).type==='wdist'? round1((w.dunit==='km'?s.d/1609.344:s.d/1760)) : round1(convD(s.d,w.dunit||'mi','mi'))):'',s.t??'',''].map(csvCell).join(','));
  });

function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cell); cell=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x!==''));
}

}

function onField(ev,commit){
  const el=ev.target; const f=el.dataset&&el.dataset.f; if(!f) return;
  const p=cur(); const v=el.type==='checkbox'?el.checked:el.value;
  switch(f){
    case 'exq': ui.exq.q=v; { const box=$('#exlist'); if(box){ const tmp=document.createElement('div'); tmp.innerHTML=exerciseBrowser(p&&p.name==='picker'); box.innerHTML=tmp.querySelector('#exlist').innerHTML; } } return;
    case 'exmuscle': ui.exq.muscle=v; render(); return;
    case 'exequip': ui.exq.equip=v; render(); return;
    case 'rrange': p.range=+v; render(); return;
    case 'excol': ui.exq.col=v; render(); return;
    case 'set': { const obj=curObj(); const s=obj.exercises[+el.dataset.e].sets[+el.dataset.s]; const c=el.dataset.c;
      if(commit){ if(c==='t'){ s.t=parseTime(v)??''; el.value=s.t!==''?fmtTime(s.t):''; } else s[c]= v===''?'':(num(v)??''); if(s[c]==='') el.value=''; }
      else s[c]=v;
      changed(false); return; }
    case 'exnote': curObj().exercises[+el.dataset.e].note=v; changed(false); return;
    case 'rname': p.obj.name=v; return; case 'rfolder': p.obj.folder=v.trim(); return; case 'rnotes': p.obj.notes=v; return;
    case 'ename': p.obj.name=v; return; case 'enotes': p.obj.notes=v; return;
    case 'wname': st.active.name=v; Store.saveActive(); return; case 'wnotes': st.active.notes=v; Store.saveActive(); return;
    case 'exname': p.draft.name=v; return;
    case 'exsteps': case 'extips': if(commit) syncExFields(p); return;
    case 'exequip2': p.draft.equipment=v; refreshPreview(); return;
    case 'extype': p.draft.type=v; return;
    case 'expat': syncExFields(p); if(v!=='__custom'){ p.draft.pattern=v; delete p.draft.anim; p.poseOpen=false; } render(); return;
    case 'pose': { const fi=p.frame||0; const fr=p.draft.anim.frames[fi]; fr[el.dataset.k]=+v; const em=el.nextElementSibling; if(em) em.textContent=v+'°'; p.holdFrame=fi; p.holdUntil=Date.now()+1600; refreshPreview(); return; }
    case 'poseAnchor': { const fi=p.frame||0; const fr=p.draft.anim.frames[fi]; const pp=fullPose(fr); const hip=placeHip(fr,pp); const j=joints(pp,hip); const key=ANCH[v]; fr.anchor={pt:v,x:Math.round(j[key][0]),y:Math.round(j[key][1])}; render(); return; }
    case 'poseAx': case 'poseAy': { const fi=p.frame||0; const fr=p.draft.anim.frames[fi]; fr.anchor=fr.anchor||{pt:'hip',x:120,y:126}; fr.anchor[f==='poseAx'?'x':'y']=+v; const em=el.nextElementSibling; if(em) em.textContent=v; p.holdFrame=fi; p.holdUntil=Date.now()+1600; refreshPreview(); return; }
    case 'poseScene': p.draft.anim.scene=v||undefined; refreshPreview(); return;
    case 'poseDur': p.draft.anim.dur=+v; const em=el.nextElementSibling; if(em) em.textContent=(v/1000).toFixed(1)+'s'; refreshPreview(); return;
    case 'srest': st.settings.rest=+v; Store.saveSettings(); return;
    case 'ssound': st.settings.sound=v; Store.saveSettings(); if(v){ audio(); beep(); } return;
    case 'swake': st.settings.wake=v; Store.saveSettings(); return;
    case 'saccent': if(commit){ st.settings.accent=v; Store.saveSettings(); render(); } else document.documentElement.style.setProperty('--accent',v); return;
    case 'importFile': if(commit&&el.files&&el.files[0]){ const file=el.files[0]; const r=new FileReader(); r.onload=()=>importText(file.name,String(r.result)).catch(e=>{console.error(e);toast('Import failed.')}); r.readAsText(file); el.value=''; } return;
  }
}

/* Render any person's world art from their saved status, without touching your own settings */
function artFor(p,opts){
  const prev={world:st.settings.world,trophy:st.settings.trophy,branch:st.settings.branch};
  try{
    st.settings.world=p.world||'hunt';
    if(p.world==='hunt'||!p.world){ st.settings.trophy=p.kind||'elk'; return trophyArt(p.kind||'elk',p.stage||0,opts); }
    if(p.world==='mil'){ st.settings.branch=p.kind||'army'; return milArt(p.stage||0,opts); }
    if(!WORLDS[p.world]) return trophyArt('elk',p.stage||0,opts);
    return WORLDS[p.world].art(p.stage||0,opts);
  } finally { Object.assign(st.settings,prev); }
}

async function resizePhoto(file){
  const url=URL.createObjectURL(file); const img=new Image(); img.src=url; await img.decode();
  const S=192, c=document.createElement('canvas'); c.width=S; c.height=S; const x=c.getContext('2d');
  const m=Math.min(img.width,img.height); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S); URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',.82);
}
Object.assign(A,{

    catch(err){ Social.err=(err&&err.code||err.message||'Something went wrong').replace('auth/','').replace(/-/g,' '); render(); } },

  addFriend:async()=>{ const c=($('#fcode').value||'').trim().toUpperCase(); Social.err=''; if(c.length!==6){ toast('Codes are 6 letters'); return; }

    catch(e){ Social.err=e.message; render(); } },

<script>
window.WH_BUILD='202611171459';
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloading) return; reloading=true; if(!(window.st&&st.active&&document.activeElement&&document.activeElement.matches&&document.activeElement.matches('input'))) location.reload(); });
}
/* When the app comes back to the screen, check GitHub for a newer version and offer it. */
(function(){
  let last=0;
  async function check(){
    if(Date.now()-last<60000) return; last=Date.now();
    try{
      const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
      const v=await r.json(); if(!v.build||v.build===window.WH_BUILD||document.getElementById('whupd')) return;
      const b=document.createElement('button'); b.id='whupd'; b.textContent='New version ready. Tap to update';
      b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:9999;border:0;border-radius:999px;padding:12px 18px;font:600 15px/1.2 Inter,system-ui,sans-serif;background:#3B82F6;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.35)';
      b.onclick=async()=>{ b.textContent='Updating…'; try{ const reg=await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }catch(e){} location.reload(); };
      document.body.appendChild(b);
    }catch(e){}
  }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); });
  window.addEventListener('pageshow',check); setTimeout(check,3000);
})();
</script>
