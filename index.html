<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Work Harder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>window.WH_STANDALONE=true;</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html [data-a^="ai"],html .card.ai{display:none!important}</style>
</head>
<body>
<title>Work Harder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app — header band, scrolling body, mini/rest bars, bottom tab bar. Dark-first like a gym floor; light mirrors it. */
:root{
  --bg:#0E1114; --surface:#161B20; --surface2:#1E252C; --line:#29313A; --fg:#EDF1F4; --muted:#8C97A3;
  --accent:#3D8BFF; --on-accent:#FFFFFF; --gold:#F2B630; --good:#2FBF71; --good-bg:rgba(47,191,113,.13); --danger:#F0564A;
  --warm:#E9B949; --drop:#B07CFF; --fail:#F0564A;
  --fig:#C9D2DA; --fig-far:#5A6570; --equip:#3A4550; --hot:#FF5A36; --hot-soft:#B9573F;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --r:14px; --r-sm:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#E9EDF1; --line:#D6DCE2; --fg:#11161B; --muted:#5D6772;
  --accent:#1E6FE8; --gold:#B57D07; --good:#178A4C; --good-bg:rgba(23,138,76,.11); --danger:#CF3A2F;
  --warm:#B98A12; --drop:#7A4BD6; --fail:#CF3A2F; --fig:#3C4650; --fig-far:#AEB7C0; --equip:#C3CBD3; --hot:#E8431E; --hot-soft:#F2A08C; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#E9EDF1; --line:#D6DCE2; --fg:#11161B; --muted:#5D6772;
  --accent:#1E6FE8; --gold:#B57D07; --good:#178A4C; --good-bg:rgba(23,138,76,.11); --danger:#CF3A2F;
  --warm:#B98A12; --drop:#7A4BD6; --fail:#CF3A2F; --fig:#3C4650; --fig-far:#AEB7C0; --equip:#C3CBD3; --hot:#E8431E; --hot-soft:#F2A08C; color-scheme:light; }

*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative}
#hdr{flex:none;background:var(--bg);border-bottom:1px solid var(--line)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-block:14px 28px;overscroll-behavior:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.ic.dim{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .good{color:var(--good)}
.minw{min-width:0;flex:1}
.center{text-align:center}

/* header */
.hdr-in{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;min-height:54px;padding-block:6px}
.hdr-l,.hdr-r{display:flex;align-items:center;gap:6px}
.hdr-in h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.02em;text-transform:uppercase;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-in h1.big{font-size:30px;font-weight:900;letter-spacing:.01em}
.hdr-l:empty{display:none}
.hdr-in:has(.hdr-l:empty){grid-template-columns:1fr auto}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--fg)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn.sm{width:30px;height:30px}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--muted);margin-inline:6px}
.syncdot[data-state="ok"]{background:var(--good)} .syncdot[data-state="busy"]{background:var(--gold)}
.statbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:8px 12px}
.statbar label,.kv3 label,.kv2 label{display:block;font-size:12px;color:var(--muted)}
.statbar b{font-size:17px;font-variant-numeric:tabular-nums}
.statbar b[data-clock]{color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-sm);border:0;background:var(--surface2);color:var(--fg);font-weight:600;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger-t{background:transparent;color:var(--danger)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.btn.strava{background:transparent;border:1.5px solid var(--line)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{height:40px}

/* type */
.sec{margin:8px 0 0;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.03em;text-transform:uppercase}
.sub{margin:4px 0 -4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 0}
.notes{margin:0;white-space:pre-wrap}

/* cards */
.card{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-size:16px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.feed{cursor:pointer}
.feed:hover{background:var(--surface2)}
.feed-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.feed h3{font-size:17px}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv3 b{font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.kv3.big b{font-size:20px}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gold b,.gold-t{color:var(--gold)}
.gold-t{display:flex;align-items:center;gap:6px}
.feed-ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.feed-ex li{display:flex;align-items:center;gap:10px;min-width:0}
.feed-ex li span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.routine .row2{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}

/* figure */
.thumb{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:11px;background:var(--surface2);flex:none;overflow:hidden}
.thumb.sm{width:32px;height:32px;border-radius:8px}
.thumb .fig{width:118%;height:118%}
.fig .fx-far{stroke:var(--fig-far);stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .fx-near,.fig .fx-body{stroke:var(--fig);stroke-width:7.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .fx-body{stroke-width:10}
.fig .fx-head{fill:var(--fig)}
.fig .fx-ground{stroke:var(--line);stroke-width:2}
.fig .fx-equip{fill:var(--equip)} .fig .fx-box{fill:var(--equip)}
.fig .fx-frame{stroke:var(--equip);stroke-width:4;fill:none;stroke-linecap:round}
.fig .fx-pad{stroke:var(--equip);stroke-width:8;fill:none;stroke-linecap:round}
.fig .fx-bar{stroke:var(--muted);stroke-width:4;fill:none;stroke-linecap:round}
.fig .fx-plate{fill:var(--accent);stroke:var(--bg);stroke-width:1.5}
.fig .fx-hub{fill:var(--bg)}
.fig .fx-db{fill:var(--accent)}
.fig .fx-cable{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:3 3;fill:none}
.fig .fx-pulley{fill:var(--surface2);stroke:var(--muted);stroke-width:1.5}
.fig .fx-water{stroke:var(--accent);stroke-width:2;fill:none;opacity:.6}
.stage{background:radial-gradient(120% 90% at 50% 100%,var(--surface2),var(--surface));border-radius:var(--r);display:grid;place-items:center;padding:6px;cursor:default}
.stage .fig{width:100%;max-width:360px;height:auto;aspect-ratio:240/210}

/* home */
.weekcard{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.wk-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.wk-count{display:flex;align-items:baseline;gap:6px}
.wk-count .num{font-family:var(--f-display);font-weight:900;font-size:46px;line-height:.9}
.wk-count .of{color:var(--muted);font-weight:600}
.streak{display:flex;align-items:center;gap:6px;color:var(--muted)}
.streak b{display:block;font-family:var(--f-display);font-size:26px;line-height:.9;color:var(--fg)}
.streak span{font-size:12px}
.streak.hot .ic{color:var(--gold)}
.wkbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.wkbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.wkdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wkday{display:grid;place-items:center;height:30px;border-radius:8px;background:var(--surface2);font-size:12px;color:var(--muted)}
.wkday.on{background:var(--accent);color:var(--on-accent)}
.wkday.today{box-shadow:inset 0 0 0 1.5px var(--fg)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:10px 4px 6px}
.empty h2{margin:0;font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.empty p{margin:0 0 6px;color:var(--muted);max-width:42ch}
.empty .row2{width:100%}
.empty-fig{width:180px;max-width:60%}
.empty-fig .fig{width:100%;height:auto}

/* exercise list */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-sm);padding:0 12px;min-height:46px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;outline:0;min-width:0;color:var(--fg);font-size:16px}
select,input:not([type]),input[type="text"],input[type="search"],textarea,.title-in{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);min-height:44px;padding:8px 12px;width:100%;color:var(--fg);font-size:16px}
textarea{resize:vertical;line-height:1.4}
.title-in{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.01em;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding-inline:0}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:8px 2px;border-bottom:1px solid var(--line)}
.exrow:hover{background:var(--surface)}
.exrow-t{display:flex;flex-direction:column;flex:1;min-width:0}
.exrow-t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exrow .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.exrow.sel .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.exrow.sel{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pad{padding:16px 0}
.floatbar{position:sticky;bottom:0;padding-block:10px;background:linear-gradient(transparent,var(--bg) 30%)}

/* logger */
.exc{gap:8px}
.exc-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.exhead{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;text-align:left;min-width:0;flex:1;flex-wrap:wrap}
.exhead b{font-size:16px}
.exhead b.acc{color:var(--accent)}
.note-in{border:0!important;background:transparent!important;padding:2px 0!important;min-height:30px!important;font-size:16px!important}
.restchip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:2px 0}
.sets{display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.srow{display:grid;align-items:center;gap:6px;padding:3px 4px;border-radius:8px;min-width:0}
.srow.g1{grid-template-columns:34px minmax(0,1.3fr) minmax(0,1fr) 40px}
.srow.g2{grid-template-columns:34px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 40px}
.srow.g1.nocheck{grid-template-columns:34px minmax(0,1fr) 34px}
.srow.g2.nocheck{grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 34px}
.srow.head{font-size:11px;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:center}
.srow.head span:nth-child(2){text-align:left}
.srow.nocheck.head span:nth-child(2){text-align:center}
.srow.done{background:var(--good-bg)}
.slab{width:30px;height:30px;border-radius:8px;border:0;background:var(--surface2);font-weight:700;font-size:14px;display:grid;place-items:center;font-variant-numeric:tabular-nums;justify-self:center}
.srow.done .slab{background:transparent}
.slab.t-w{color:var(--warm)} .slab.t-d{color:var(--drop)} .slab.t-f{color:var(--fail)}
.prev{border:0;background:transparent;color:var(--muted);font-size:13px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0;min-width:0}
.cell{text-align:center;min-height:36px!important;padding:4px 2px!important;border-radius:8px!important;background:var(--surface2)!important;border:0!important;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.cell::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.srow.done .cell{background:transparent!important}
.chk{width:36px;height:34px;border-radius:9px;border:0;background:var(--surface2);display:grid;place-items:center;color:var(--muted);justify-self:center}
.chk.on{background:var(--good);color:#fff}
.chk .ic{width:20px;height:20px}
.chk.on .prflag{color:#fff}
.prflag{display:grid;place-items:center}
.rm{width:30px;height:30px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;justify-self:center}

/* mannequin + muscle map */
.fig .mq{fill:var(--fig);stroke:var(--fig);stroke-width:.6;stroke-linejoin:round}
.fig .mq.far{fill:var(--fig-far);stroke:var(--fig-far)}
.fig .mq.mp,.fig .mo.mp{fill:var(--hot);stroke:var(--hot)}
.fig .mq.ms,.fig .mo.ms{fill:var(--hot-soft);stroke:var(--hot-soft)}
.fig .mq.far.mp{fill:color-mix(in srgb,var(--hot) 60%,var(--fig-far));stroke:none}
.fig .mq.far.ms{fill:color-mix(in srgb,var(--hot-soft) 55%,var(--fig-far));stroke:none}
.fig .mo{stroke-width:.5;stroke-linejoin:round}
.thumb .fig .mq{stroke-width:1.2}
.musc-in{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:center}
.bodymap{width:100%;height:auto;display:block}
.bm-sil{fill:var(--surface2)}
.bm{fill:color-mix(in srgb,var(--fg) 12%,var(--surface2))}
.bm.p{fill:var(--hot)} .bm.s{fill:var(--hot-soft)}
.bm-lbl{fill:var(--muted);font-size:10px;font-family:var(--f-body);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.musc-k{display:flex;flex-direction:column;gap:12px}
.musc-k b{font-size:13px}
.musc-k p{margin:2px 0 0;font-size:14px}
.key{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.key.p{background:var(--hot)} .key.s{background:var(--hot-soft)}
@media (max-width:380px){.musc-in{grid-template-columns:1fr}}
/* routine page */
.linkhead{border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.sec-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.acc-t{color:var(--accent);font-weight:600}
.rex{gap:8px}
.rline{display:flex;align-items:center;gap:6px}
.rtable{display:flex;flex-direction:column;border:0;background:transparent;padding:0;width:100%;text-align:center;border-radius:8px}
.rtable:hover{background:var(--surface2)}
.rrow{display:grid;align-items:center;gap:6px;padding:6px 0;font-weight:600}
.rrow:nth-child(odd):not(.head){background:color-mix(in srgb,var(--surface2) 55%,transparent);border-radius:6px}
.rrow.g1{grid-template-columns:40px 1fr} .rrow.g2{grid-template-columns:40px 1fr 1fr}
.rrow.head{font-size:11px;letter-spacing:.07em;color:var(--muted);font-weight:700}
.rrow .slab{width:26px;height:26px;font-size:13px}
.card-h select{width:auto;min-height:34px;padding:4px 8px;font-size:14px}
/* coaching cues */
.cue{margin:0;display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.35;color:var(--fg);background:var(--surface2);border-radius:8px;padding:8px 10px}
.cue .ic{color:var(--accent);margin-top:1px}
textarea.note-in{resize:none;field-sizing:content;min-height:30px!important}
.plan summary{cursor:pointer;list-style:none}
.plan p{margin:0;white-space:pre-line;font-size:14px;line-height:1.45}
/* supersets */
.exc.ss{box-shadow:inset 3px 0 0 var(--drop)}
.ssbadge{align-self:flex-start;display:inline-flex;align-items:center;border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--drop) 20%,transparent);color:var(--drop)}
/* Nippard tiers */
.tier{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;font-family:var(--f-display);font-weight:900;font-size:16px;flex:none;background:var(--surface2);color:var(--muted)}
.tier.tS{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}
.tier.tA{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.tier.tB{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.tier.tD,.tier.tF{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.tier.gem{color:var(--drop);background:color-mix(in srgb,var(--drop) 16%,transparent)}
.tiers{display:flex;flex-wrap:wrap;gap:8px 16px}
.tierrow{display:flex;align-items:center;gap:8px;font-weight:600}
.nipcard p{margin:0}

/* rest + mini */
.restbar,.mini{flex:none;background:var(--surface);border-top:1px solid var(--line)}
.rest-in{position:relative;display:flex;align-items:center;gap:10px;padding-block:8px;overflow:hidden}
.rest-fill{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 16%,transparent);transition:width .25s linear;pointer-events:none}
.rest-in>*{position:relative}
.rest-t{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.rest-t .num{font-family:var(--f-display);font-weight:800;font-size:28px}
.restbar.over .rest-t .num{color:var(--good);font-size:22px}
.mini-in{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding-block:10px;text-align:left}
.mini-in b{display:block}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 10px transparent}}

/* nav */
#nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--muted);padding:8px 0 6px;font-size:11px;font-weight:600;letter-spacing:.02em}
#nav button[aria-current="page"]{color:var(--accent)}

/* detail */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;border:0}
.chip.soft{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.chips.pick .chip{cursor:pointer}
.chips.pick .chip.on{background:var(--accent);color:var(--on-accent);box-shadow:none}
.chips.pick .chip.on.soft{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--fg)}
.seg{display:flex;background:var(--surface);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;min-height:36px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-selected="true"]{background:var(--surface2);color:var(--fg)}
.card .seg{background:var(--surface2)} .card .seg button[aria-selected="true"]{background:var(--bg)}
.seg.sm button{min-height:30px;font-size:13px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;max-width:65ch}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:14px}
.steps.sm li::before{width:22px;height:22px;font-size:12px}
.tips ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.setlist{display:flex;flex-direction:column;gap:4px}
.sl{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.sl .slab{width:26px;height:26px;font-size:13px}
.sl .muted{margin-left:auto}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2)}
.badge.gold{color:var(--gold);background:color-mix(in srgb,var(--gold) 15%,transparent)}
.badge.off{color:var(--muted)}
.prlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.prlist li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.prlist li:last-child{border-bottom:0}
.prlist li .muted{grid-column:1}
.prlist li b{grid-column:2;grid-row:1/span 2;align-self:center;font-variant-numeric:tabular-nums}
.linkrow{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;padding:0;text-align:left;grid-column:1/-1}

/* celebrate */
.celebrate{padding-top:6px}
.medal{width:84px;height:84px;margin:4px auto 0;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.medal .ic{width:44px;height:44px}
.bigname{margin:0;font-family:var(--f-display);font-size:30px;text-transform:uppercase}
.liftbig{display:flex;flex-direction:column;align-items:center;line-height:.9;margin-top:4px}
.liftbig .num{font-family:var(--f-display);font-weight:900;font-size:clamp(56px,18vw,88px);color:var(--accent);animation:rise .7s .1s ease-out both}
.liftbig .unit{font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-size:13px;margin-top:8px}
.lead{font-size:17px;margin:0}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(12px);opacity:.2}to{transform:none;opacity:1}}

/* profile */
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pstats>div{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column}
.pstats .num{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;overflow:hidden;text-overflow:ellipsis}
.pstats label{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface2)}
.heat i.on{background:var(--accent)} .heat i.fut{opacity:.35}
.heat-lbl{display:none}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .bar{fill:color-mix(in srgb,var(--accent) 45%,transparent)} .chart .bar.cur{fill:var(--accent)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .area{fill:color-mix(in srgb,var(--accent) 16%,transparent)}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .pt{fill:var(--accent)}
.mbars{display:flex;flex-direction:column;gap:7px}
.mb{display:grid;grid-template-columns:96px 1fr 36px;align-items:center;gap:10px;font-size:13px}
.mb i{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.mb i b{display:block;height:100%;background:var(--accent);border-radius:4px}
.mb em{font-style:normal;color:var(--muted);text-align:right}
.bwrow{display:flex;gap:8px} .bwrow input{flex:1;min-width:0}
.bwlist{list-style:none;margin:8px 0 0;padding:0}
.bwlist li{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.bwlist li b{margin-left:auto;font-variant-numeric:tabular-nums}
details summary{cursor:pointer}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:13px;font-weight:600;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:12px;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--c,var(--surface2));font-size:10px;font-weight:700;color:var(--muted);display:grid;place-items:center;position:relative;overflow:hidden}
.sw.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.sw.custom{background:conic-gradient(#f0564a,#f2b630,#2fbf71,#16b8c4,#3d8bff,#b06cff,#f0564a)}
.sw.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.conn{gap:4px}
.conn p{margin:0}
.conn-h{display:flex;justify-content:space-between;align-items:center}
.note{background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.note.warn{box-shadow:inset 3px 0 0 var(--gold)}
.card.ai{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,var(--surface)),var(--surface) 70%)}
.card.ai h3{display:flex;align-items:center;gap:6px}
.card.ai p{margin:0}
.pose{display:flex;flex-direction:column;gap:8px}
.pose p{margin:0}
.frames{display:flex;flex-wrap:wrap;gap:6px}
.frames .chip.on{background:var(--accent);color:var(--on-accent)}
.slider{display:grid;grid-template-columns:110px 1fr 46px;align-items:center;gap:8px;font-size:13px}
.slider input{width:100%;accent-color:var(--accent);min-width:0}
.slider em{font-style:normal;text-align:right;color:var(--muted)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sh-back{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fade .2s}
.sh-card{position:relative;background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;width:100%;max-width:720px;margin:0 auto;animation:slide .25s ease-out}
.sh-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.sh-title{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.menu{display:flex;flex-direction:column}
.menu-i{display:flex;align-items:center;gap:12px;min-height:50px;border:0;background:transparent;text-align:left;padding:0 4px;border-bottom:1px solid var(--line);font-weight:500}
.menu-i:last-child{border-bottom:0}
.menu-i span{flex:1}
.menu-i .ic.sm{color:var(--accent)}
.copyrow{display:flex;gap:6px;align-items:flex-start}
.copyrow input,.copyrow textarea{flex:1;min-width:0}
.sug{background:var(--surface2)}
.sug-h{display:flex;gap:10px;align-items:center}
.sug p{margin:0}
.sug .thumb{background:var(--surface)}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateY(40px);opacity:.4}}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;opacity:0;transition:.2s;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){ .heat-lbl{display:none} #main{padding-block:20px 40px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

    out[id] = {id,name,pattern,equipment,type,primary,secondary,steps,tips:tips||[],builtin:true,...(extra||{})};
  }
  return out;
}

const TIER_ORDER={S:0,A:1,B:2,C:3,D:4,F:5};
function parseNip(s){
  if(!s) return null;
  const o={ranks:[],top:/\*top/.test(s),gem:/\*gem/.test(s)};
  for(const part of s.replace(/\*top|\*gem/g,'').split(',')){ const [m,t]=part.split(':'); if(m&&t&&TIER_ORDER[t.trim()]!=null) o.ranks.push([m.trim(),t.trim()]); }
  o.best = o.ranks.length? o.ranks.map(r=>r[1]).sort((a,b)=>TIER_ORDER[a]-TIER_ORDER[b])[0] : null;
  return o;
}

    const [id,name,pattern,equipment,type,prim,sec,steps,tips,nip]=f;
    const ex={id,name,pattern,equipment,type,primary:prim?prim.split(','):[],secondary:sec?sec.split(','):[],steps:steps?steps.split('~'):[],tips:tips?tips.split('~'):[],builtin:true};
    if(nip) ex.nip=parseNip(nip);
    if(load) ex.load=load;
    BUILTIN[id]=ex;
  }
  for(const [id,s] of Object.entries(NIP_TAGS)) if(BUILTIN[id]) BUILTIN[id].nip=parseNip(s);
})();

      const ex=svg.__ex; if(!ex) return;

      this.items.set(svg,{ex,prep,far:svg.querySelector('.fx-far'),body:svg.querySelector('.fx-body'),near:svg.querySelector('.fx-near'),head:svg.querySelector('.fx-head'),props:svg.querySelector('.fx-props')});
    });
    if(this.items.size && !this.raf) this.raf=requestAnimationFrame(this.tick.bind(this));
  },
  tick(now){
    this.raf=0;
    if(!this.items.size) return;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    for(const [svg,it] of this.items){
      if(!svg.isConnected){this.items.delete(svg);continue}

      const pp = holding ? it.prep.solved[Math.min(svg.__hold,it.prep.solved.length-1)] : reduce ? it.prep.solved[(svg.__frameIdx||0)%it.prep.solved.length] : poseAt(it.prep,now-this.t0);

  async migrate(local,cloud){

    if(st.active && !this.activeSeen) jobs.push(()=>this.refs.active.set(st.active));

let _stats=null;

function toLb(w,unit){ return unit==='kg'? w/KG : w; }

function bodyweightAt(t){ const en=(st.body&&st.body.entries||[]).filter(e=>e&&e.w).sort((a,b)=>a.t-b.t); if(!en.length) return 0; let b=en[0]; for(const e of en){ if(e.t<=t) b=e; } return toLb(b.w,b.u||'lb'); }
function workoutVolumeLb(w){ let v=0; let bw=null; for(const e of w.exercises||[]){ const ex=getEx(e.exId); if(!['wr','wreps','wtime'].includes(ex.type)) continue; for(const s of e.sets||[]){ if(!w.saved&&!s.done) continue; let ww=num(s.w)||0; const r=num(s.r); if(ex.type==='wreps'){ if(bw==null) bw=bodyweightAt(w.start||Date.now()); ww=toLb(ww,w.unit||'lb')+bw; if(ww&&r) v+=ww*r; } else if(ww&&r) v+=toLb(ww,w.unit||'lb')*r; } } return v; }

function stats(){
  if(_stats) return _stats;
  const list=workoutsSorted(); const byEx={};
  for(const w of list){
    for(const e of w.exercises||[]){
      const arr = byEx[e.exId] || (byEx[e.exId]=[]);

}
/* best values for an exercise before a time (lb-normalized) */
function bests(exId,before=Infinity){
  const b={heavy:0,e1rm:0,setvol:0,reps:0,time:0,dist:0};
  for(const {w,e} of (stats().byEx[exId]||[])){
    if(w.start>=before) continue;
    for(const s of e.sets||[]){
      const ww=toLb(num(s.w)||0,w.unit), r=num(s.r)||0, t=num(s.t)||0, d=num(s.d)||0;
      if(r>0 && ww>b.heavy) b.heavy=ww;
      const one=e1rm(ww,r); if(one>b.e1rm) b.e1rm=one;
      if(ww*r>b.setvol) b.setvol=ww*r;
      if(r>b.reps) b.reps=r; if(t>b.time) b.time=t; if(d>b.dist) b.dist=d;
    }
  }
  return b;
}
function computePRs(w){
  const out=[]; const seen=new Set();
  for(const e of w.exercises||[]){
    if(seen.has(e.exId)) continue; seen.add(e.exId);
    const ex=getEx(e.exId); const b=bests(e.exId,w.start);
    const hadHistory = (stats().byEx[e.exId]||[]).some(x=>x.w.start<w.start);
    if(!hadHistory) continue;
    const cur={heavy:0,e1rm:0,setvol:0,reps:0,time:0};
    for(const s of e.sets||[]){
      const ww=toLb(num(s.w)||0,w.unit), r=num(s.r)||0, t=num(s.t)||0;
      if(r>0&&ww>cur.heavy)cur.heavy=ww; const one=e1rm(ww,r); if(one>cur.e1rm)cur.e1rm=one;
      if(ww*r>cur.setvol)cur.setvol=ww*r; if(r>cur.reps)cur.reps=r; if(t>cur.time)cur.time=t;
    }
    const wt=['wr','wreps','wtime'].includes(ex.type);
    if(wt && cur.heavy>b.heavy && b.heavy>0) out.push({exId:e.exId,kind:'heavy',v:cur.heavy});
    if(wt && cur.e1rm>b.e1rm+0.01 && b.e1rm>0) out.push({exId:e.exId,kind:'e1rm',v:cur.e1rm});
    if(wt && cur.setvol>b.setvol && b.setvol>0) out.push({exId:e.exId,kind:'setvol',v:cur.setvol});
    if(ex.type==='reps' && cur.reps>b.reps && b.reps>0) out.push({exId:e.exId,kind:'reps',v:cur.reps});
    if((ex.type==='time'||ex.type==='wtime') && cur.time>b.time && b.time>0) out.push({exId:e.exId,kind:'time',v:cur.time});
  }
  return out;
}
const PR_LABEL={heavy:'Heaviest weight',e1rm:'Best est. 1-rep max',setvol:'Best set volume',reps:'Most reps',time:'Longest hold'};
function prValue(p){ const u=st.settings.unit; if(p.kind==='reps') return `${fmtN(p.v)} reps`; if(p.kind==='time') return fmtTime(p.v); return `${fmtN(convW(p.v,'lb',u),u==='kg'?1:0)} ${u}`; }
function weekStreak(){
  const weeks=new Set(workoutsSorted().map(w=>weekStart(w.start)));
  let wk=weekStart(Date.now()); if(!weeks.has(wk)) wk-=7*DAY;
  let n=0; while(weeks.has(wk)){ n++; wk-=7*DAY; }
  return n;
}
function prevSetsFor(exId,beforeStart){
  for(const {w,e} of (stats().byEx[exId]||[])){ if(beforeStart && w.start>=beforeStart) continue; return {sets:e.sets||[],unit:w.unit||'lb',dunit:w.dunit}; }
  return null;
}

const FAMILIES=[['squat','lunge','legpress','stepup','sissy','revnordic'],['hinge','rdl','goodmorning','rackpull','kbswing','backext'],['bench','incline','fly','seatpress','cablefly','pushup','dip','pressout','floorpress'],['pullup','pulldown','straightpull'],['row','csrow','cablerow','pendlay','sealrow','invrow'],['latraise','yraise'],['revfly','revcable','facepull'],['ohp','seatohp','landmine'],['curl','preacher','bayesian','inclinecurl','spider'],['pushdown','ohtri','skull','kickback'],['bridge','quadkick','kickleg','seated'],['legext'],['legcurl','seatlegcurl','nordic']];

function alternativesFor(ex,max=6){
  const mapped=(ex.primary||[]).map(m=>NIPLIST[m]).filter(Boolean);
  const list=mapped[0]; const fam=famOf(ex.pattern);
  const pool=allEx().filter(e=>e.id!==ex.id&&e.nip);
  const cand=[];
  for(const e of pool){
    let r=null;
    if(list) r=e.nip.ranks.find(x=>x[0]===list||mapped.includes(x[0]));
    else if((e.primary||[]).some(m=>(ex.primary||[]).includes(m))) r=[e.nip.top?'Top pick':'',e.nip.best||'S'];

    cand.push({e,t:r[1],l:r[0],same:fam>=0&&famOf(e.pattern)===fam});

  let out=cand.filter(c=>c.same);
  if(out.length<2) out = list? cand : out;

     <div><span class="num">${fmtN(totalSec/3600,0)}</span><label>Hours</label></div>
   </div>
   ${calendarCard(ws)}

  </section>`;
  return {hdr:hdr('Profile',{right:`<span id="syncdot" class="syncdot"></span><button class="iconbtn" data-a="settings" aria-label="Settings">${ic('gear')}</button>`}),body};
}
};

/* ---------- Exercise browser (tab + picker) ---------- */
function exerciseBrowser(pick){
  const q=ui.exq; const qs=norm(q.q);
  const colOk=e=>{ const n=e.nip; switch(q.col){ case 'nip': return !!n; case 'nipS': return !!(n&&n.best&&TIER_ORDER[n.best]<=1); case 'top': return !!(n&&n.top); case 'gem': return !!(n&&n.gem); case 'custom': return !!e.custom&&!BUILTIN[e.id]; default: return true; } };
  let list=allEx().filter(e=>(!qs||norm(e.name).includes(qs)||norm((e.primary||[]).join(' ')).includes(qs)) && (!q.muscle||(e.primary||[]).includes(q.muscle)||(e.secondary||[]).includes(q.muscle)) && (!q.equip||e.equipment===q.equip) && colOk(e));
  if(q.col&&q.col.startsWith('nip')) list=list.sort((a,b)=>TIER_ORDER[nipTierFor(a,q.muscle)]-TIER_ORDER[nipTierFor(b,q.muscle)]||a.name.localeCompare(b.name));
  const sel = pick? (cur().sel||[]) : [];
  const rows=list.map(e=>`<li><button class="exrow ${sel.includes(e.id)?'sel':''}" data-a="${pick?'pickToggle':'openEx'}" data-id="${esc(e.id)}">${thumb(e)}<span class="exrow-t"><b>${esc(e.name)}</b><span class="muted small">${esc((e.primary||[]).join(', '))}${e.custom&&!BUILTIN[e.id]?' · Custom':''}</span></span>${nipBadge(e,q.muscle)}${pick?`<span class="tick">${sel.includes(e.id)?sel.indexOf(e.id)+1:''}</span>`:ic('right','dim')}</button></li>`).join('');
  return `<div class="gut stack">
   <label class="search">${ic('search')}<input id="exq" data-f="exq" type="search" placeholder="Search ${allEx().length} exercises" value="${esc(q.q)}" autocomplete="off"></label>
   <div class="row2">
    <select id="exmus" data-f="exmuscle" aria-label="Muscle"><option value="">All muscles</option>${MUSCLES.map(m=>`<option ${q.muscle===m?'selected':''}>${m}</option>`).join('')}</select>
    <select id="exeq" data-f="exequip" aria-label="Equipment"><option value="">All equipment</option>${EQUIP.map(m=>`<option ${q.equip===m?'selected':''}>${m}</option>`).join('')}</select>
   </div>
   <select id="excol" data-f="excol" aria-label="Collection"><option value="">All exercises</option><option value="nip" ${q.col==='nip'?'selected':''}>Jeff Nippard: all ranked, best first</option><option value="nipS" ${q.col==='nipS'?'selected':''}>Jeff Nippard: S and A tier only</option><option value="top" ${q.col==='top'?'selected':''}>Jeff Nippard: top pick per muscle</option><option value="gem" ${q.col==='gem'?'selected':''}>Jeff Nippard: underrated picks</option><option value="custom" ${q.col==='custom'?'selected':''}>My exercises</option></select>
   ${pick?`<div class="row2"><button class="btn" data-a="newEx" data-from="picker">${ic('plus')} Create exercise</button><button class="btn" data-a="aiSuggest">${ic('spark')} Ask Claude</button></div>`:''}
   <ul class="exlist" id="exlist">${rows}${q.q.trim()?`<li class="pad"><button class="btn wide" data-a="aiCreateNamed" data-from="${pick?'picker':''}">${ic('spark')} ${rows?'Not it? ':''}Have Claude add "${esc(q.q.trim())}"</button></li>`:''}${!rows&&!q.q.trim()?`<li class="muted pad">Nothing matches these filters.</li>`:''}</ul>
  </div>`;
}

/* ---------- Pages ---------- */
const PAGES={
missing(){ return {hdr:hdr('',{left:backBtn}),body:''}; },

/* Workout logger used for live workouts, editing past workouts and routines */
active(p){ return loggerPage(st.active,'active'); },
wedit(p){ return loggerPage(p.obj,'edit'); },
redit(p){ return loggerPage(p.obj,'routine'); },

picker(p){

},

save(p){

done(p){

  const streak=weekStreak(); const prs=w.prs||[];
  const dur=((w.end||w.start)-w.start)/1000;

  body:`<section class="gut stack celebrate">

    ${r.notes?`<details class="plan card"><summary><b>Game plan</b></summary><p>${esc(r.notes)}</p></details>`:''}
    <div class="sec-row"><h2 class="sec">Exercises</h2>${tpl?`<button class="btn ghost sm" data-a="saveTpl" data-id="${esc(r.id)}">Save to my routines</button>`:`<button class="btn ghost sm" data-a="editRoutine" data-id="${esc(r.id)}">${ic('edit','sm')} Edit routine</button>`}</div>
    ${(r.exercises||[]).map((e,i)=>{ const X=getEx(e.exId); const cols=colsFor(X); const rest=e.rest==null?st.settings.rest:e.rest;

        <button class="rtable" data-a="${tpl?'saveTpl':'editRoutine'}" data-id="${esc(r.id)}" aria-label="Edit sets">
          <span class="rrow head g${cols.length}"><span>SET</span>${cols.map(c=>`<span>${colLabel(c,X)}</span>`).join('')}</span>
          ${e.sets.map((s,si)=>`<span class="rrow g${cols.length}"><span class="slab t-${s.type||'n'}">${setLabel(e.sets,si)}</span>${cols.map(c=>`<span class="num">${c==='t'?(s.t?fmtTime(s.t):'–'):c==='w'?(s.w!==''&&s.w!=null?wDisp(s.w,r.unit):'–'):(s[c]!==''&&s[c]!=null?esc(s[c]):'–')}</span>`).join('')}</span>`).join('')}

exd(p){

    inner=`${ex.steps&&ex.steps.length?`<ol class="steps">${ex.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:`<p class="muted">No steps yet. Tap Edit to add them, or have Claude write them.</p>`}
     ${ex.tips&&ex.tips.length?`<div class="card tips"><h3>Tips</h3><ul>${ex.tips.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}`;
  } else if(tab==='hist'){
    inner = h.length? h.map(({w,e})=>`<div class="card"><button class="exhead" data-a="openW" data-id="${esc(w.id)}"><b>${esc(w.name)}</b><span class="muted small">${esc(fmtDate(w.start))}</span></button>
      <div class="setlist">${(e.sets||[]).map((s,i)=>`<div class="sl"><span class="slab t-${s.type||'n'}">${setLabel(e.sets,i)}</span><span>${esc(setText(s,ex,w.unit,w.dunit))}</span></div>`).join('')}</div></div>`).join('') : `<p class="muted">You haven't logged this one yet.</p>`;

settings(){

  if(mode==='edit') top=`<input id="ename" class="title-in" data-f="ename" value="${esc(obj.name)}"><textarea id="enotes" data-f="enotes" rows="2" placeholder="Description">${esc(obj.notes||'')}</textarea>`;

  if(mode==='active'&&obj.plan) top+=`<details class="plan card" open><summary><b>Today's game plan</b></summary><p>${esc(obj.plan)}</p></details>`;

function colsFor(ex){ return TYPES[ex.type]?.cols || ['w','r']; }

function calendarCard(ws){
  const days=new Map(); for(const w of ws){ const d=startOfDay(w.start); days.set(d,(days.get(d)||0)+1); }
  const end=weekStart(Date.now())+6*DAY; const weeks=16; const start=end-(weeks*7-1)*DAY;
  let cells=''; for(let i=0;i<weeks*7;i++){ const d=start+i*DAY; const n=days.get(d)||0; const fut=d>startOfDay(Date.now()); cells+=`<i class="${n?'on':''} ${fut?'fut':''}" title="${fmtDate(d)}${n?`: ${n} workout${n>1?'s':''}`:''}"></i>`; }
  return `<div class="card"><div class="card-h"><h3>Last 16 weeks</h3><span class="muted small">${ws.filter(w=>w.start>=start).length} workouts</span></div><div class="heat">${cells}</div><div class="heat-lbl muted small"><span>M</span><span></span><span>W</span><span></span><span>F</span><span></span><span>S</span></div></div>`;
}
function weeklyChart(ws){
  const m=ui.profileMetric; const u=st.settings.unit; const N=12; const wk0=weekStart(Date.now())-(N-1)*7*DAY;
  const vals=Array(N).fill(0);
  for(const w of ws){ if(w.start<wk0) continue; const i=Math.floor((weekStart(w.start)-wk0)/(7*DAY)); if(i<0||i>=N) continue;
    if(m==='volume') vals[i]+=convW(workoutVolumeLb(w),'lb',u); else if(m==='duration') vals[i]+=((w.end||w.start)-w.start)/3600000; else vals[i]+=1; }
  const max=Math.max(...vals,0); const nice = niceMax(max||1);
  const W=320,H=150,pl=34,pb=20,pt=10; const bw=(W-pl-6)/N;
  const lbl=v=> m==='volume'? (v>=1000? fmtN(v/1000,1)+'k':fmtN(v)) : m==='duration'? fmtN(v,1)+'h' : fmtN(v);
  let bars=''; vals.forEach((v,i)=>{ const h=(H-pt-pb)*v/nice; const x=pl+i*bw+3; bars+=`<rect class="bar ${i===N-1?'cur':''}" x="${x.toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${Math.max(h,v?2:0).toFixed(1)}" rx="3"/>`; });
  const grid=[0,0.5,1].map(f=>{ const y=H-pb-(H-pt-pb)*f; return `<line class="grid" x1="${pl}" x2="${W-4}" y1="${y}" y2="${y}"/><text class="axis" x="${pl-6}" y="${y+3}" text-anchor="end">${lbl(nice*f)}</text>`; }).join('');
  const xl=[0,4,8,11].map(i=>`<text class="axis" x="${pl+i*bw+bw/2}" y="${H-5}" text-anchor="middle">${new Date(wk0+i*7*DAY).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`).join('');
  const total=vals[N-1];
  return `<div class="card"><div class="card-h"><h3>This week: ${m==='volume'?`${fmtN(total)} ${u}`:m==='duration'?`${fmtN(total,1)} h`:`${total} workouts`}</h3></div>
   <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly ${m}">${grid}${bars}${xl}</svg>
   <div class="seg sm">${[['volume','Volume'],['duration','Duration'],['count','Workouts']].map(([k,l])=>`<button data-a="pmetric" data-v="${k}" aria-selected="${m===k}">${l}</button>`).join('')}</div></div>`;
}
function lineChart(pts,fmt){

   ${pts.length>1?`<polygon class="area" points="${X(t0)},${H-pb} ${poly} ${X(t1)},${H-pb}"/><polyline class="line" points="${poly}"/>`:''}

   <text class="axis" x="${pl}" y="${H-4}">${new Date(t0).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>${pts.length>1?`<text class="axis" x="${W-4}" y="${H-4}" text-anchor="end">${new Date(t1).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`:''}</svg>`;

function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function muscleCard(ws){

  }

}

const POSE_GUIDE = `Animation format (2D side view, figure faces right, ground at y=196, canvas 240x210). Each frame: {"t":torso,"ua":near upper arm,"fa":near forearm,"ua2":far upper arm,"fa2":far forearm,"th":near thigh,"sh":near shin,"th2":far thigh,"sh2":far shin,"fo":foot angle relative to shin (default 90),"sg":shrug px,"anchor":{"pt":"hip|ankle|ankle2|toe|toe2|hand|hand2|knee|knee2|shoulder","x":number,"y":number}}. All angles are absolute degrees. Limbs: 0 = pointing straight down, 90 = forward (right), 180 = up, -90 = backward (left). Torso: 0 = upright, 90 = bent forward flat, -90 = lying on back with head to the left. Far limbs default to the near values. Segment lengths: torso 48, upper arm 27, forearm 25, thigh 38, shin 36. The anchor pins one joint at a fixed point; use ankle at (120,192) for standing moves, hip for lying or seated moves. Example squat: frames [{"ua":85,"fa":85,"anchor":{"pt":"ankle","x":120,"y":192}},{"t":38,"ua":95,"fa":95,"th":80,"sh":-22,"anchor":{"pt":"ankle","x":120,"y":192}}]. Use 2 to 5 frames; they play in a loop. Optional "scene": one of bench, incline, seat, lowseat, bar, dips, box, wall, bike, rower, legpress, hyper, water. Optional "load": hands, back, front, hips, none.`;

function cleanEx(o,base){
  const d={...base};

    if(typeof o.name==='string'&&o.name.trim()) d.name=o.name.trim().slice(0,80);
    if(EQUIP.includes(o.equipment)) d.equipment=o.equipment;
    if(TYPES[o.type]) d.type=o.type;
    if(Array.isArray(o.primary)) d.primary=o.primary.filter(m=>MUSCLES.includes(m)).slice(0,4);
    if(Array.isArray(o.secondary)) d.secondary=o.secondary.filter(m=>MUSCLES.includes(m)&&!(d.primary||[]).includes(m)).slice(0,5);
    if(Array.isArray(o.steps)) d.steps=o.steps.filter(s=>typeof s==='string').map(s=>s.trim().slice(0,240)).filter(Boolean).slice(0,8);
    if(Array.isArray(o.tips)) d.tips=o.tips.filter(s=>typeof s==='string').map(s=>s.trim().slice(0,240)).filter(Boolean).slice(0,4);
    if(PATTERNS[o.pattern]) { d.pattern=o.pattern; delete d.anim; }
    const an=cleanAnim(o.anim); if(an){ d.anim=an; if(!PATTERNS[o.pattern]) d.pattern='stand'; }

function cleanAnim(a){
  if(!a||!Array.isArray(a.frames)) return null;

    if(!f||typeof f!=='object') return null; const o={};
    for(const k of POSE_KEYS){ const v=Number(f[k]); if(f[k]!=null&&isFinite(v)) o[k]=Math.max(-360,Math.min(360,v)); }
    if(f.anchor&&ANCH[f.anchor.pt]){ o.anchor={pt:f.anchor.pt,x:Math.max(-40,Math.min(280,Number(f.anchor.x)||120)),y:Math.max(-40,Math.min(250,Number(f.anchor.y)||126))}; }

function guessPattern(name){
  const n=String(name).toLowerCase();
  const map=[['pull-up','pullup'],['pullup','pullup'],['chin','pullup'],['pulldown','pulldown'],['deadlift','hinge'],['rdl','rdl'],['romanian','rdl'],['good morning','goodmorning'],['squat','squat'],['lunge','lunge'],['split','lunge'],['step','stepup'],['leg press','legpress'],['extension','legext'],['leg curl','legcurl'],['calf','calf'],['bench','bench'],['incline','incline'],['fly','fly'],['crossover','cablefly'],['push-up','pushup'],['pushup','pushup'],['dip','dip'],['overhead','ohp'],['shoulder press','ohp'],['military','ohp'],['lateral','latraise'],['front raise','frontraise'],['reverse fly','revfly'],['rear delt','revfly'],['upright','uprow'],['shrug','shrug'],['face pull','facepull'],['row','row'],['curl','curl'],['pushdown','pushdown'],['skull','skull'],['kickback','kickback'],['hip thrust','bridge'],['bridge','bridge'],['swing','kbswing'],['crunch','crunch'],['sit-up','situp'],['situp','situp'],['leg raise','legraise'],['knee raise','hkr'],['plank','plank'],['twist','russian'],['rollout','abwheel'],['dead bug','deadbug'],['bird dog','birddog'],['climber','mountain'],['burpee','burpee'],['jump','jumpsquat'],['carry','carry'],['walk','walk'],['run','run'],['jog','run'],['bike','cycle'],['cycl','cycle'],['row','rower'],['swim','swim'],['press','ohp']];
  for(const [k,v] of map) if(n.includes(k)) return v;
  return 'stand';
}

/* ---------- Data export / import ---------- */
async function saveFile(filename,data,title){
  if(window.WH_STANDALONE){
    try{ const file=new File([data],filename,{type:/\.json$/.test(filename)?'application/json':'text/csv'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:filename}); return; }
      const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); toast('Saved'); return;
    }catch(e){ if(e&&e.name==='AbortError') return; }
  }
  try{ const dl=window.claude&&window.claude.use? await window.claude.use('downloads'):null;
    if(dl){ await dl.save({filename,data}); toast('Saved'); return; } }
  catch(e){ if(e&&e.code==='declined') return; }
  openSheet({kind:'text',title,note:'Downloads aren\'t available here, so copy this and save it somewhere safe.',text:data});
}
function csvCell(v){ v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCSV(){
  const head=['title','start_time','end_time','description','exercise_title','superset_id','exercise_notes','set_index','set_type','weight_lbs','reps','distance_miles','duration_seconds','rpe'];
  const out=[head.join(',')]; const tn={n:'normal',w:'warmup',d:'dropset',f:'failure'};
  const fmtD=t=>{const d=new Date(t);return `${d.getDate()} ${d.toLocaleString('en-US',{month:'short'})} ${d.getFullYear()}, ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
  for(const w of workoutsSorted().reverse()) for(const e of w.exercises||[]) (e.sets||[]).forEach((s,i)=>{
    out.push([w.name,fmtD(w.start),fmtD(w.end||w.start),w.notes||'',getEx(e.exId).name,'',e.note||'',i,tn[s.type||'n'],s.w!=null?round1(convW(s.w,w.unit||'lb','lb')):'',s.r??'',s.d!=null?(getEx(e.exId).type==='wdist'? round1((w.dunit==='km'?s.d/1609.344:s.d/1760)) : round1(convD(s.d,w.dunit||'mi','mi'))):'',s.t??'',''].map(csvCell).join(','));
  });
  return out.join('\n');
}
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cell); cell=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x!==''));
}
function parseHevyDate(s){
  const m=String(s).match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4}),?\s+(\d{1,2}):(\d{2})/);
  if(m){ const mo='janfebmaraprmayjunjulaugsepoctnovdec'.indexOf(m[2].toLowerCase())/3; if(mo>=0) return new Date(+m[3],mo,+m[1],+m[4],+m[5]).getTime(); }
  const t=Date.parse(s); return isFinite(t)?t:null;
}
async function importText(name,text){
  let added=0;
  if(/\.json$/i.test(name)||/^\s*\{/.test(text)){
    let d; try{ d=JSON.parse(text);}catch(e){ toast('That file isn\'t a valid backup.'); return; }
    if(!d||!d.app||d.app!=='work-harder'){ toast('That file isn\'t a Work Harder backup.'); return; }
    for(const k of ['custom','routines','workouts']) for(const [id,v] of Object.entries(d[k]||{})){ if(!st[k][id]){ Store.put(k,id,v); added++; } }
    if(d.body&&Array.isArray(d.body.entries)){ const have=new Set(st.body.entries.map(e=>e.t)); for(const e of d.body.entries) if(!have.has(e.t)) st.body.entries.push(e); Store.saveBody(); }
    toast(`Imported ${added} item${added===1?'':'s'}`); render(); return;
  }
  const rows=parseCSV(text); if(rows.length<2){ toast('That CSV is empty.'); return; }
  const h=rows[0].map(x=>x.trim().toLowerCase()); const ix=k=>h.indexOf(k);
  const iT=ix('title'), iS=ix('start_time'), iE=ix('end_time'), iD=ix('description'), iX=ix('exercise_title'), iN=ix('exercise_notes'), iST=ix('set_type');
  const iWl=ix('weight_lbs'), iWk=ix('weight_kg'), iR=ix('reps'), iDm=ix('distance_miles'), iDk=ix('distance_km'), iSec=ix('duration_seconds');
  if(iX<0||iS<0){ toast('This doesn\'t look like a Hevy workout export.'); return; }
  const groups=new Map(); const newEx={};
  for(const r of rows.slice(1)){
    const key=(r[iT]||'')+'|'+r[iS]; let g=groups.get(key);
    if(!g){ const start=parseHevyDate(r[iS]); if(!start) continue; g={id:'h'+start.toString(36)+norm(r[iT]).slice(0,8),name:r[iT]||'Workout',start,end:parseHevyDate(r[iE])||start,notes:iD>=0?r[iD]:'',unit:st.settings.unit,dunit:st.settings.dist,saved:true,exercises:[],imported:'hevy'}; groups.set(key,g); }
    const exName=r[iX]; let ex=findExByName(exName);
    if(!ex){ const nid='c_'+norm(exName).slice(0,40); ex=newEx[nid]||st.custom[nid]; if(!ex){ ex={id:nid,name:exName,pattern:guessPattern(exName),equipment:/barbell/i.test(exName)?'Barbell':/dumbbell/i.test(exName)?'Dumbbell':/cable/i.test(exName)?'Cable':/machine/i.test(exName)?'Machine':'Other',type:'wr',primary:[],secondary:[],steps:[],tips:[],custom:true}; newEx[nid]=ex; } }
    let block=g.exercises[g.exercises.length-1]; if(!block||block.exId!==ex.id){ block={exId:ex.id,note:iN>=0?r[iN]:'',sets:[]}; const ssi=h.indexOf('superset_id'); if(ssi>=0&&r[ssi]!==''&&r[ssi]!=null) block.ss=String.fromCharCode(65+(parseInt(r[ssi],10)||0)%26); g.exercises.push(block); }
    const tmap={normal:'n',warmup:'w',dropset:'d',failure:'f'};
    let w=iWl>=0&&r[iWl]!==''? convW(num(r[iWl]),'lb',st.settings.unit) : iWk>=0&&r[iWk]!==''? convW(num(r[iWk]),'kg',st.settings.unit) : null;
    let d=iDm>=0&&r[iDm]!==''? convD(num(r[iDm]),'mi',st.settings.dist) : iDk>=0&&r[iDk]!==''? convD(num(r[iDk]),'km',st.settings.dist) : null;
    const s={type:tmap[(r[iST]||'normal').toLowerCase()]||'n'}; if(w!=null) s.w=round1(w); if(num(r[iR])!=null) s.r=num(r[iR]); if(d!=null) s.d=Math.round(d*1000)/1000; if(num(r[iSec])) s.t=num(r[iSec]);
    block.sets.push(s);
  }
  // fix exercise types for new customs by looking at data
  for(const ex of Object.values(newEx)){ let hasW=false,hasR=false,hasT=false,hasD=false; for(const g of groups.values()) for(const b of g.exercises) if(b.exId===ex.id) for(const s of b.sets){ if(s.w)hasW=true; if(s.r)hasR=true; if(s.t)hasT=true; if(s.d)hasD=true; }
    ex.type = hasD&&hasW?'wdist': hasD?'cardio': hasW&&hasR?'wr': hasR?'reps': hasW&&hasT?'wtime': hasT?'time':'wr'; Store.put('custom',ex.id,ex); }
  for(const g of groups.values()) for(const b of g.exercises){ const X=newEx[b.exId]||getEx(b.exId); if(X.type==='wdist') for(const s of b.sets) if(s.d!=null) s.d=Math.round(st.settings.dist==='km'? s.d*1000 : s.d*1760); }
  for(const g of groups.values()){ if(!st.workouts[g.id]){ Store.put('workouts',g.id,g); added++; } }
  // records after all are in
  invalidateStats(); for(const g of groups.values()){ const w=st.workouts[g.id]; if(w&&w.imported){ const prs=computePRs(w); if(prs.length){ w.prs=prs; Store.put('workouts',w.id,w); } } }
  toast(`Imported ${added} workout${added===1?'':'s'} from Hevy`); render();
}

    const obj=curObj(); const e=obj.exercises[+d.e]; const s=e.sets[+d.s]; const ex=getEx(e.exId);
    if(!s.done){
      const prev=prevSetsFor(e.exId); const ps=prev&&prev.sets[+d.s];
      for(const c of colsFor(ex)){
        if(s[c]!==''&&s[c]!=null) continue;
        if(s['p'+c]!==''&&s['p'+c]!=null) s[c]=s['p'+c];
        else if(ps&&ps[c]!=null) s[c]= c==='w'? round1(convW(num(ps.w),prev.unit,obj.unit)) : ps[c];
      }
      const has=colsFor(ex).some(c=>s[c]!==''&&s[c]!=null);
      if(!has){ toast(`Enter ${colLabel(colsFor(ex)[colsFor(ex).length-1],ex).toLowerCase()} first`); return; }
      s.done=true;
      const nx=obj.exercises[+d.e+1];
      const midSuperset = e.ss && nx && nx.ss===e.ss;
      if(cur().name==='active' && !midSuperset){ const rest=e.rest==null?st.settings.rest:e.rest; startRest(rest); }
      if(midSuperset) toast(`Superset: next up ${getEx(nx.exId).name}`);
    } else s.done=false;
    changed(true);
  },
  addSet:(d)=>{ const obj=curObj(); const e=obj.exercises[+d.e]; const last=e.sets[e.sets.length-1]; const s=newSet();
    if(last){ for(const k of ['pw','pr','pt','pd']) if(last[k]!=null) s[k]=last[k]; if(cur().name==='redit'){ s.w=last.w; s.r=last.r; s.t=last.t; s.d=last.d; } }
    if(cur().name==='wedit') s.done=true;
    e.sets.push(s); changed(true); },
  rmSet:(d)=>{ const obj=curObj(); obj.exercises[+d.e].sets.splice(+d.s,1); changed(true); },
  finish:()=>{ const a=st.active; const done=a.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
    if(!done){ confirmSheet('No sets checked off yet','Check off the sets you finished, or discard this workout.','Discard workout',()=>A.doDiscard()); return; }
    push({name:'save'}); },
  checkAll:()=>{ for(const e of st.active.exercises) for(const s of e.sets){ const ex=getEx(e.exId); for(const c of colsFor(ex)) if((s[c]===''||s[c]==null)&&s['p'+c]!=null&&s['p'+c]!=='') s[c]=s['p'+c]; if(colsFor(ex).some(c=>s[c]!==''&&s[c]!=null)) s.done=true; } changed(true); },
  discard:()=>confirmSheet('Discard this workout?','Nothing from this session will be saved.','Discard',()=>A.doDiscard()),
  doDiscard:()=>{ st.active=null; Store.saveActive(true); ui.rest=null; wake(false); ui.stack=[]; ui.tab='workout'; render(); },
  saveWorkout:()=>{
    const a=clone(st.active); const n=$('#wname'); if(n&&n.value.trim()) a.name=n.value.trim(); const nt=$('#wnotes'); if(nt) a.notes=nt.value;
    a.end=Date.now(); normalizeSets(a,true); a.saved=true; delete a.sess; delete a.updatedAt;
    if(!a.exercises.length){ toast('Check off at least one set.'); return; }
    a.prs=computePRs(a);
    Store.put('workouts',a.id,a);
    st.active=null; Store.saveActive(true); ui.rest=null; wake(false);
    ui.tab='home'; ui.stack=[{name:'done',id:a.id}]; render(); $('#main').scrollTop=0;
  },
  doneClose:()=>{ ui.stack=[]; ui.tab='home'; render(); },
  editSave:()=>{ const p=cur(); const o=clone(p.obj); normalizeSets(o,true); o.saved=true; if(!o.name) o.name='Workout'; o.prs=computePRs(o); Store.put('workouts',o.id,o); ui.stack.pop(); toast('Workout updated'); render(); },
  routineSave:()=>{ const p=cur(); const o=clone(p.obj); o.name=(o.name||'').trim()||'Untitled routine'; normalizeSets(o,false); for(const e of o.exercises) for(const s of e.sets) delete s.done; o.updated=Date.now(); if(o.order==null) o.order=routinesSorted().length; Store.put('routines',o.id,o); ui.stack.pop(); toast('Routine saved'); render(); },
  routineDelete:()=>{ const p=cur(); confirmSheet('Delete this routine?','Past workouts stay in your history.','Delete',()=>{ Store.del('routines',p.obj.id); ui.stack.pop(); ui.stack=ui.stack.filter(x=>!(x.name==='rview'&&x.id===p.obj.id)); render(); }); },

  /* rest */
  restAdj:(d)=>{ if(!ui.rest) return; ui.rest.end=Math.max(Date.now(),ui.rest.end)+(+d.v)*1000; ui.rest.total=Math.max(1,ui.rest.total+(+d.v)); ui.rest.beeped=false; ui.rest.hideAt=0; renderRest(); },
  restSkip:()=>{ ui.rest=null; renderRest(); },

  /* sheets */
  sheetClose:()=>closeSheet(),
  menuPick:(d)=>{ const it=ui.sheet.items[+d.i]; closeSheet(); it&&it.fn&&it.fn(); },
  confirmOk:()=>{ const fn=ui.sheet.fn; closeSheet(); fn&&fn(); },
  sugGo:async()=>{
    const s=ui.sheet; s.text=($('#sugq')||{}).value||''; if(!s.text.trim()){ toast('Describe what you\'re looking for.'); return; }
    s.busy=true; s.error=''; renderSheet();
    try{
      const lib=allEx().map(e=>e.name).join('; ');
      const res=await askClaude(`You recommend exercises for a lifter's workout tracking app. Return only JSON: {"suggestions":[4 to 8 items, each ${exSchemaText()} plus "why": one sentence on why it fits]}.\nPattern ids for the animation: ${PAT_LIST()}. Prefer a pattern; only write "anim" if none is close.\n${POSE_GUIDE}\nThe person's library already has: ${lib}. You may suggest library exercises (use the exact library name) or new ones.\n\nRequest: ${s.text}`);
      const arr=Array.isArray(res&&res.suggestions)?res.suggestions:[];
      s.results=arr.slice(0,8).map(o=>{ const existing=findExByName(o&&o.name); const exObj=existing||cleanEx(o,{id:'c_'+uid(),name:'New exercise',equipment:'Other',type:'wr',primary:[],secondary:[],steps:[],tips:[],pattern:guessPattern(o&&o.name),custom:true}); return {name:exObj.name,why:typeof o.why==='string'?o.why.slice(0,240):'',equipment:exObj.equipment,primary:exObj.primary,existing:!!existing,exObj}; });
      if(!s.results.length) s.error='Claude didn\'t return any exercises. Try rephrasing.';
    }catch(e){ s.error=aiError(e); }
    s.busy=false; if(ui.sheet===s) renderSheet();
  },
  sugAdd:(d)=>{ const s=ui.sheet; const r=s.results[+d.i]; Store.put('custom',r.exObj.id,clone(r.exObj)); r.added=true; renderSheet(); const p=cur(); if(p&&p.name==='picker'){ (p.sel=p.sel||[]).push(r.exObj.id); } softRender(true); toast(`Added ${r.name}`); },
  sugView:(d)=>{ const r=ui.sheet.results[+d.i]; closeSheet(); push({name:'exd',id:r.exObj.id,tab:'how'}); },
  airGo:async()=>{
    const s=ui.sheet; s.text=($('#airq')||{}).value||''; if(!s.text.trim()){ toast('Describe the routine you want.'); return; }
    s.busy=true; s.error=''; renderSheet();
    try{
      const lib=allEx().map(e=>`${e.name} [${TYPES[e.type]?.label||e.type}]`).join('; ');
      const res=await askClaude(`You build gym routines for a workout tracking app. Return only JSON: {"name":string,"notes":one short sentence,"exercises":[{"name":string,"sets":integer 1-6,"reps":integer or null,"seconds":integer or null (for timed holds or cardio),"rest":seconds between sets,"note":short cue or "","new":null or (only for exercises not in the library) ${exSchemaText()}}]}.\nUse names exactly as they appear in this library whenever possible: ${lib}.\nPattern ids for new exercises: ${PAT_LIST()}.\nWeights are left blank for the lifter to fill in.\n\nRoutine request: ${s.text}`);
      const o={id:uid(),name:(res&&typeof res.name==='string'&&res.name.trim())||'New routine',notes:(res&&typeof res.notes==='string')?res.notes:'',unit:st.settings.unit,exercises:[]};
      for(const it of (res&&Array.isArray(res.exercises)?res.exercises:[]).slice(0,14)){
        if(!it||!it.name) continue;
        let ex=findExByName(it.name);
        if(!ex){ ex=cleanEx(it.new||{name:it.name},{id:'c_'+uid(),name:String(it.name).slice(0,80),equipment:'Other',type:it.seconds?'time':'wr',primary:[],secondary:[],steps:[],tips:[],pattern:guessPattern(it.name),custom:true}); Store.put('custom',ex.id,clone(ex)); }
        const n=Math.max(1,Math.min(8,parseInt(it.sets,10)||3));
        o.exercises.push({exId:ex.id,note:typeof it.note==='string'?it.note.slice(0,120):'',rest:Math.max(0,Math.min(600,parseInt(it.rest,10)||st.settings.rest)),sets:Array.from({length:n},()=>({type:'n',w:'',r:it.reps!=null?(parseInt(it.reps,10)||''):'',t:it.seconds!=null?(parseInt(it.seconds,10)||''):'',d:''}))});
      }
      if(!o.exercises.length) throw {code:'empty'};
      closeSheet(); push({name:'redit',isNew:true,obj:o}); toast('Review the routine and tap Save');
      return;
    }catch(e){ s.error= e&&e.code==='empty'? 'Claude didn\'t return any exercises. Try rephrasing.' : aiError(e); }
    s.busy=false; if(ui.sheet===s) renderSheet();
  },

  /* settings & profile */
  setS:(d)=>{ const k=d.k; let v=d.v; if(k==='goal') v=+v; const old=st.settings[k]; st.settings[k]=v; if(k==='unit'&&st.active&&old!==v){ convertObjUnit(st.active,v); Store.saveActive(); } Store.saveSettings(); render(); },
  setAccent:(d)=>{ st.settings.accent=d.v; Store.saveSettings(); render(); },
  exportJSON:()=>{ const data=JSON.stringify({app:'work-harder',version:1,exported:new Date().toISOString(),settings:st.settings,custom:st.custom,routines:st.routines,workouts:st.workouts,body:st.body},null,1); saveFile(`work-harder-backup-${new Date().toISOString().slice(0,10)}.json`,data,'Backup'); },
  exportCSV:()=>saveFile(`work-harder-workouts-${new Date().toISOString().slice(0,10)}.csv`,exportCSV(),'Workouts CSV'),
  pmetric:(d)=>{ ui.profileMetric=d.v; const m=$('#main'); const y=m.scrollTop; render(); $('#main').scrollTop=y; },
  bwAdd:()=>{ const el=$('#bwin'); const v=num(el&&el.value); if(!v||v<40||v>900){ toast('Enter your weight as a number.'); return; }
    const t=Date.now(); const today=startOfDay(t); st.body.entries=(st.body.entries||[]).filter(e=>startOfDay(e.t)!==today); st.body.entries.push({t,w:v,u:st.settings.unit}); Store.saveBody(); toast('Logged'); render(); },
  bwDel:(d)=>{ st.body.entries=st.body.entries.filter(e=>String(e.t)!==String(d.t)); Store.saveBody(); render(); },
};
function syncExFields(p){
  const d=p.draft; const g=id=>document.getElementById(id);
  if(g('exname')) d.name=g('exname').value;
  if(g('exsteps')) d.steps=g('exsteps').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(g('extips')) d.tips=g('extips').value.split('\n').map(s=>s.trim()).filter(Boolean);
}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]'); if(!t) { const tb=ev.target.closest('[data-tab]'); if(tb){ setTab(tb.dataset.tab); } return; }
  if(t.disabled) return;
  const fn=A[t.dataset.a]; if(!fn) return;
  if(t.tagName==='A') return;
  ev.preventDefault();
  try{ fn(t.dataset); }catch(e){ console.error(e); toast('Something went wrong. Try again.'); }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&ui.sheet){ closeSheet(); return; }
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('article[data-a]')){ ev.preventDefault(); ev.target.click(); }
  if(ev.key==='Enter'&&ev.target.matches('input.cell')){ ev.preventDefault(); const all=$$('input.cell'); const i=all.indexOf(ev.target); if(all[i+1]) all[i+1].focus(); else ev.target.blur(); }
});

/* ---------- Field input ---------- */
function onField(ev,commit){
  const el=ev.target; const f=el.dataset&&el.dataset.f; if(!f) return;
  const p=cur(); const v=el.type==='checkbox'?el.checked:el.value;
  switch(f){
    case 'exq': ui.exq.q=v; { const box=$('#exlist'); if(box){ const tmp=document.createElement('div'); tmp.innerHTML=exerciseBrowser(p&&p.name==='picker'); box.innerHTML=tmp.querySelector('#exlist').innerHTML; } } return;
    case 'exmuscle': ui.exq.muscle=v; render(); return;
    case 'exequip': ui.exq.equip=v; render(); return;
    case 'rrange': p.range=+v; render(); return;
    case 'excol': ui.exq.col=v; render(); return;
    case 'set': { const obj=curObj(); const s=obj.exercises[+el.dataset.e].sets[+el.dataset.s]; const c=el.dataset.c;
      if(commit){ if(c==='t'){ s.t=parseTime(v)??''; el.value=s.t!==''?fmtTime(s.t):''; } else s[c]= v===''?'':(num(v)??''); if(s[c]==='') el.value=''; }
      else s[c]=v;
      changed(false); return; }
    case 'exnote': curObj().exercises[+el.dataset.e].note=v; changed(false); return;
    case 'rname': p.obj.name=v; return; case 'rnotes': p.obj.notes=v; return;
    case 'ename': p.obj.name=v; return; case 'enotes': p.obj.notes=v; return;
    case 'wname': st.active.name=v; Store.saveActive(); return; case 'wnotes': st.active.notes=v; Store.saveActive(); return;
    case 'exname': p.draft.name=v; return;
    case 'exsteps': case 'extips': if(commit) syncExFields(p); return;
    case 'exequip2': p.draft.equipment=v; refreshPreview(); return;
    case 'extype': p.draft.type=v; return;
    case 'expat': syncExFields(p); if(v!=='__custom'){ p.draft.pattern=v; delete p.draft.anim; p.poseOpen=false; } render(); return;
    case 'pose': { const fi=p.frame||0; const fr=p.draft.anim.frames[fi]; fr[el.dataset.k]=+v; const em=el.nextElementSibling; if(em) em.textContent=v+'°'; p.holdFrame=fi; p.holdUntil=Date.now()+1600; refreshPreview(); return; }
    case 'poseAnchor': { const fi=p.frame||0; const fr=p.draft.anim.frames[fi]; const pp=fullPose(fr); const hip=placeHip(fr,pp); const j=joints(pp,hip); const key=ANCH[v]; fr.anchor={pt:v,x:Math.round(j[key][0]),y:Math.round(j[key][1])}; render(); return; }
    case 'poseAx': case 'poseAy': { const fi=p.frame||0; const fr=p.draft.anim.frames[fi]; fr.anchor=fr.anchor||{pt:'hip',x:120,y:126}; fr.anchor[f==='poseAx'?'x':'y']=+v; const em=el.nextElementSibling; if(em) em.textContent=v; p.holdFrame=fi; p.holdUntil=Date.now()+1600; refreshPreview(); return; }
    case 'poseScene': p.draft.anim.scene=v||undefined; refreshPreview(); return;
    case 'poseDur': p.draft.anim.dur=+v; const em=el.nextElementSibling; if(em) em.textContent=(v/1000).toFixed(1)+'s'; refreshPreview(); return;
    case 'srest': st.settings.rest=+v; Store.saveSettings(); return;
    case 'ssound': st.settings.sound=v; Store.saveSettings(); if(v){ audio(); beep(); } return;
    case 'swake': st.settings.wake=v; Store.saveSettings(); return;
    case 'saccent': if(commit){ st.settings.accent=v; Store.saveSettings(); render(); } else document.documentElement.style.setProperty('--accent',v); return;
    case 'importFile': if(commit&&el.files&&el.files[0]){ const file=el.files[0]; const r=new FileReader(); r.onload=()=>importText(file.name,String(r.result)).catch(e=>{console.error(e);toast('Import failed.')}); r.readAsText(file); el.value=''; } return;
  }
}
function refreshPreview(){
  const p=cur(); const stg=$('.stage'); if(!stg||!p) return;
  stg.innerHTML=figSVG(p.draft,{anim:'__draft',cls:'big'}); postRender();
}
document.addEventListener('input',e=>onField(e,false));
document.addEventListener('change',e=>onField(e,true));
document.addEventListener('focusout',()=>{ if(ui.dirtyRender){ setTimeout(()=>{ const a=document.activeElement; if(!(a&&a.matches&&a.matches('input,textarea,select'))){ ui.dirtyRender=false; softRender(); } },50); } });

/* ---------- Boot ---------- */
(function boot(){
  render();
  Store.init().then(()=>{ render(); if(st.active) wake(true); });
})();
</script>
<script>if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }</script>
